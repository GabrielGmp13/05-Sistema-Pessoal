<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisão — Sistema Pessoal</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* ── Views ───────────────────────────────────── */
    .view { display: none; }
    .view.ativa { display: block; }

    /* ── Page header ─────────────────────────────── */
    .page-header { margin-bottom: 1.25rem; }
    .page-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      margin: 0 0 .2rem;
      color: var(--text);
    }
    .page-header p { margin: 0; font-size: .82rem; color: #555; }

    /* ── Progresso ───────────────────────────────── */
    .progresso-wrap {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1.25rem;
    }
    .progresso-barra-wrap {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .progresso-barra {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width .3s ease;
    }
    .progresso-texto {
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      color: #555;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Card de revisão ─────────────────────────── */
    .rev-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .rev-card-label {
      padding: .55rem 1.1rem;
      border-bottom: 1px solid var(--border);
      font-size: .68rem;
      color: #444;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rev-card-corpo {
      flex: 1;
      padding: 1.5rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rev-card-texto {
      font-size: 1.1rem;
      color: var(--text);
      text-align: center;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* Separador entre frente e verso */
    .rev-separador {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: 0 1.25rem;
      margin: -.25rem 0;
    }
    .rev-sep-linha {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .rev-sep-icone { font-size: .8rem; color: #444; }

    .rev-card-verso {
      border-top: none;
      border-radius: 0 0 14px 14px;
    }
    .rev-card-verso .rev-card-corpo {
      padding-top: 1rem;
      padding-bottom: 1.5rem;
    }
    .rev-card-verso .rev-card-texto { color: var(--accent); }

    /* ── Botão revelar ───────────────────────────── */
    .btn-revelar {
      width: 100%;
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .75rem;
      font-size: .9rem;
      color: #888;
      cursor: pointer;
      transition: border-color .15s, color .15s;
      margin-bottom: 1rem;
    }
    .btn-revelar:hover { border-color: var(--accent); color: var(--text); }

    /* ── Botões de qualidade ─────────────────────── */
    .qualidade-wrap {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .5rem;
    }
    @media (max-width: 360px) {
      .qualidade-wrap { grid-template-columns: repeat(2, 1fr); }
    }

    .btn-qual {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .3rem;
      padding: .7rem .4rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      transition: border-color .12s, background .12s, transform .1s;
    }
    .btn-qual:hover  { transform: translateY(-2px); }
    .btn-qual:active { transform: translateY(0); }

    .btn-qual[data-q="0"] { border-color: rgba(239,68,68,.3); }
    .btn-qual[data-q="1"] { border-color: rgba(251,146,60,.3); }
    .btn-qual[data-q="2"] { border-color: rgba(163,230,53,.3); }
    .btn-qual[data-q="3"] { border-color: rgba(184,245,102,.5); }

    .btn-qual[data-q="0"]:hover { background: rgba(239,68,68,.08); border-color: #ef4444; }
    .btn-qual[data-q="1"]:hover { background: rgba(251,146,60,.08); border-color: #fb923c; }
    .btn-qual[data-q="2"]:hover { background: rgba(163,230,53,.08); border-color: #a3e635; }
    .btn-qual[data-q="3"]:hover { background: rgba(184,245,102,.1); border-color: var(--accent); }

    .btn-qual-emoji { font-size: 1.3rem; line-height: 1; }
    .btn-qual-label { font-size: .65rem; color: #666; text-align: center; }
    .btn-qual-num   {
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem;
      color: #333;
    }

    /* ── Tela: concluído ─────────────────────────── */
    .concluido-wrap {
      text-align: center;
      padding: 2rem 1rem;
    }
    .concluido-icone { font-size: 3rem; margin-bottom: .75rem; }
    .concluido-titulo {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem;
      color: var(--text);
      margin: 0 0 .4rem;
    }
    .concluido-sub {
      font-size: .85rem;
      color: #555;
      margin: 0 0 1.5rem;
      line-height: 1.6;
    }
    .concluido-stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }
    .stat-item { text-align: center; }
    .stat-val {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      color: var(--accent);
      font-weight: 700;
    }
    .stat-label {
      display: block;
      font-size: .7rem;
      color: #555;
      margin-top: .15rem;
    }

    /* ── Tela: sem cards ─────────────────────────── */
    .vazio-wrap {
      text-align: center;
      padding: 2.5rem 1rem;
    }
    .vazio-icone { font-size: 2.5rem; margin-bottom: .75rem; }
    .vazio-titulo {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      color: var(--text);
      margin: 0 0 .4rem;
    }
    .vazio-sub {
      font-size: .85rem;
      color: #555;
      margin: 0 0 1.25rem;
      line-height: 1.6;
    }

    /* ── Seção de cards existentes ───────────────── */
    .sec-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .85rem;
    }
    .sec-header h2 {
      font-family: 'Syne', sans-serif;
      font-size: .95rem;
      margin: 0;
      color: var(--text);
    }
    .btn-sm {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      padding: .32rem .75rem;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter .12s;
    }
    .btn-sm:hover { filter: brightness(1.1); }

    .cards-lista { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1rem; }

    .card-item {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .55rem .75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .card-item-textos { flex: 1; min-width: 0; }
    .card-frente-preview {
      display: block;
      font-size: .82rem;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-meta {
      display: flex;
      gap: .6rem;
      margin-top: .15rem;
    }
    .card-meta-item {
      font-family: 'JetBrains Mono', monospace;
      font-size: .68rem;
      color: #555;
    }
    .card-proxima-hoje { color: var(--accent); }
    .btn-del-card {
      background: none;
      border: none;
      color: #3a3a3a;
      cursor: pointer;
      font-size: .75rem;
      padding: .15rem .3rem;
      border-radius: 4px;
      transition: color .12s;
      flex-shrink: 0;
    }
    .btn-del-card:hover { color: #ff6b6b; }

    /* ── Loading ─────────────────────────────────── */
    #loading { text-align: center; padding: 3rem; color: #555; font-size: .9rem; }

    /* ── Vazio (lista) ───────────────────────────── */
    .vazio {
      text-align: center;
      color: #444;
      font-size: .82rem;
      padding: 1.25rem;
      line-height: 1.6;
    }

    /* ── Toast ───────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(56px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .6rem 1.2rem;
      font-size: .82rem;
      color: var(--text);
      z-index: 200;
      opacity: 0;
      transition: transform .2s ease, opacity .2s ease;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.ok   { border-color: var(--accent); }
    .toast.erro { border-color: #ff6b6b; }

    /* ── Modal ───────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.2rem .8rem;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 {
      margin: 0;
      font-family: 'Syne', sans-serif;
      font-size: .95rem;
      color: var(--text);
    }
    .modal-close {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: .85rem;
      padding: .2rem .3rem;
      transition: color .15s;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body {
      padding: 1.1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: .85rem;
    }
    .modal-body label {
      display: block;
      font-size: .75rem;
      color: #777;
      margin-bottom: .3rem;
      letter-spacing: .02em;
    }
    .modal-body textarea {
      width: 100%;
      box-sizing: border-box;
      resize: vertical;
      min-height: 80px;
    }
    .modal-footer {
      display: flex;
      gap: .6rem;
      justify-content: flex-end;
      padding: .75rem 1.2rem 1.1rem;
    }
    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #888;
      cursor: pointer;
      padding: .4rem .8rem;
      font-size: .82rem;
      transition: border-color .12s;
    }
    .btn-ghost:hover { border-color: #555; }
    .btn-salvar-modal {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      padding: .4rem .9rem;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter .12s;
    }
    .btn-salvar-modal:hover   { filter: brightness(1.1); }
    .btn-salvar-modal:disabled { opacity: .45; cursor: default; filter: none; }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">SP</a>
    <div class="nav-links">
      <a href="index.html">Dashboard</a>
    </div>
  </nav>

  <main class="container">

    <div id="loading">Carregando…</div>

    <div id="conteudo" style="display:none">

      <!-- ── View: Revisão em andamento ──────────── -->
      <div id="view-revisao" class="view">
        <div class="page-header">
          <h1>Revisão do dia</h1>
        </div>

        <!-- Progresso -->
        <div class="progresso-wrap">
          <div class="progresso-barra-wrap">
            <div id="progresso-barra" class="progresso-barra" style="width:0%"></div>
          </div>
          <span id="progresso-texto" class="progresso-texto">0 / 0</span>
        </div>

        <!-- Frente do card -->
        <div class="rev-card">
          <div class="rev-card-label">
            <span>Frente</span>
            <span id="card-intervalo" style="color:#333"></span>
          </div>
          <div class="rev-card-corpo">
            <p id="card-frente" class="rev-card-texto"></p>
          </div>
        </div>

        <!-- Botão revelar -->
        <button id="btn-revelar" class="btn-revelar">Mostrar resposta</button>

        <!-- Verso (oculto até revelar) -->
        <div id="verso-wrap" style="display:none">
          <div class="rev-separador">
            <div class="rev-sep-linha"></div>
            <span class="rev-sep-icone">↓</span>
            <div class="rev-sep-linha"></div>
          </div>

          <div class="rev-card rev-card-verso">
            <div class="rev-card-label"><span>Verso</span></div>
            <div class="rev-card-corpo">
              <p id="card-verso" class="rev-card-texto"></p>
            </div>
          </div>

          <!-- Avaliação -->
          <div class="qualidade-wrap">
            <button class="btn-qual" data-q="0">
              <span class="btn-qual-emoji">😶</span>
              <span class="btn-qual-label">Não lembrei</span>
              <span class="btn-qual-num">0</span>
            </button>
            <button class="btn-qual" data-q="1">
              <span class="btn-qual-emoji">😬</span>
              <span class="btn-qual-label">Quase</span>
              <span class="btn-qual-num">1</span>
            </button>
            <button class="btn-qual" data-q="2">
              <span class="btn-qual-emoji">🙂</span>
              <span class="btn-qual-label">Lembrei</span>
              <span class="btn-qual-num">2</span>
            </button>
            <button class="btn-qual" data-q="3">
              <span class="btn-qual-emoji">😎</span>
              <span class="btn-qual-label">Fácil</span>
              <span class="btn-qual-num">3</span>
            </button>
          </div>
        </div>
      </div>

      <!-- ── View: Tudo em dia ────────────────────── -->
      <div id="view-concluido" class="view">
        <div class="concluido-wrap">
          <div class="concluido-icone">✅</div>
          <h2 class="concluido-titulo">Revisão concluída!</h2>
          <p class="concluido-sub" id="concluido-sub"></p>
          <div class="concluido-stats">
            <div class="stat-item">
              <span class="stat-val" id="stat-revisados">0</span>
              <span class="stat-label">Revisados</span>
            </div>
            <div class="stat-item">
              <span class="stat-val" id="stat-acertos">0</span>
              <span class="stat-label">Acertos (≥ 2)</span>
            </div>
            <div class="stat-item">
              <span class="stat-val" id="stat-tempo">0m</span>
              <span class="stat-label">Tempo</span>
            </div>
          </div>
        </div>
      </div>

      <!-- ── View: Sem cards ─────────────────────── -->
      <div id="view-vazio" class="view">
        <div class="vazio-wrap">
          <div class="vazio-icone">🌿</div>
          <h2 class="vazio-titulo">Tudo em dia</h2>
          <p class="vazio-sub">Nenhum card vence hoje.<br>Continue adicionando conteúdo para revisar.</p>
        </div>
      </div>

      <!-- ── Gerenciar cards ──────────────────────── -->
      <section class="card" style="margin-top:1.5rem">
        <div class="sec-header">
          <h2>Meus cards</h2>
          <button id="btn-novo-card" class="btn-sm">+ Novo</button>
        </div>
        <div id="cards-lista" class="cards-lista"></div>
        <p id="cards-vazio" class="vazio" style="display:none">
          Nenhum card criado ainda.
        </p>
      </section>

    </div>
  </main>

  <!-- ── Modal: Novo card ────────────────────────── -->
  <div id="modal-card" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3>Novo card</h3>
        <button class="modal-close" data-fechar="modal-card" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body">
        <div>
          <label for="input-frente">Frente (pergunta)</label>
          <textarea id="input-frente" placeholder="Ex: Qual a fórmula de Bhaskara?" rows="3"></textarea>
        </div>
        <div>
          <label for="input-verso">Verso (resposta)</label>
          <textarea id="input-verso" placeholder="Ex: x = (−b ± √Δ) / 2a" rows="3"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" data-fechar="modal-card">Cancelar</button>
        <button id="btn-salvar-card" class="btn-salvar-modal">Criar card</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/sm2.js"></script>
  <script>
    'use strict';

    // ── Estado ────────────────────────────────────
    let userId     = null;
    let todosCards = [];    // todos os cards do usuário (para lista de gerenciamento)
    let fila       = [];    // cards vencidos hoje, em ordem de revisão
    let indice     = 0;     // card atual na fila
    let hojeStr    = '';

    // Métricas da sessão
    let inicioSessao = null;
    let acertos = 0;

    // ── Bootstrap ─────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      const session = await window.authReady;
      if (!session) return;
      await inicializar(session.user.id);
    });

    async function inicializar(uid) {
      userId   = uid;
      hojeStr  = new Date().toISOString().split('T')[0];

      await carregarCards();

      document.getElementById('loading').style.display  = 'none';
      document.getElementById('conteudo').style.display = '';

      iniciarRevisao();
      renderListaCards();
      bindEventos();
    }

    // ── Carregar todos os cards ───────────────────
    async function carregarCards() {
      const { data, error } = await window.sb
        .from('revisao_espacada')
        .select('*')
        .eq('user_id', userId)
        .eq('deleted', false)
        .order('proxima_revisao', { ascending: true });

      if (error) { console.error('revisao_espacada:', error.message); return; }
      todosCards = data ?? [];
    }

    // ── Iniciar sessão de revisão ─────────────────
    function iniciarRevisao() {
      // Cards com proxima_revisao <= hoje (ou null = novo card, revisar já)
      fila = todosCards.filter(c =>
        !c.proxima_revisao || c.proxima_revisao <= hojeStr
      );
      indice = 0;
      acertos = 0;
      inicioSessao = Date.now();

      if (fila.length === 0) {
        mostrarView('view-vazio');
      } else {
        mostrarView('view-revisao');
        mostrarCardAtual();
      }
    }

    // ── Exibir card atual ─────────────────────────
    function mostrarCardAtual() {
      const card = fila[indice];

      // Progresso
      const pct = fila.length > 0 ? (indice / fila.length) * 100 : 0;
      document.getElementById('progresso-barra').style.width = `${pct}%`;
      document.getElementById('progresso-texto').textContent = `${indice} / ${fila.length}`;

      // Conteúdo
      document.getElementById('card-frente').textContent = card.pergunta ?? '';

      // Intervalo atual (informativo)
      const dias = card.intervalo_dias ?? 0;
      document.getElementById('card-intervalo').textContent =
        dias > 0 ? `intervalo atual: ${dias}d` : 'card novo';

      // Reset verso
      document.getElementById('card-verso').textContent = card.resposta ?? '';
      document.getElementById('verso-wrap').style.display  = 'none';
      document.getElementById('btn-revelar').style.display = '';
    }

    // ── Revelar verso ─────────────────────────────
    function revelarVerso() {
      document.getElementById('btn-revelar').style.display  = 'none';
      document.getElementById('verso-wrap').style.display   = '';
    }

    // ── Avaliar card ──────────────────────────────
    async function avaliarCard(qualidade) {
      const card = fila[indice];
      if (!card) return;

      // Desabilitar botões enquanto salva
      document.querySelectorAll('.btn-qual').forEach(b => { b.disabled = true; });

      // Calcular novos valores SM-2
      // NOTA: window.calcularSM2 exportado por sm2.js
      // Assinatura real: calcularSM2(ef, repeticoes, intervaloDias, qualidade) → { ef, repeticoes, intervaloDias, proximaRevisao }
      const { ef: novoEf, repeticoes: novasRepeticoes, intervaloDias: novoIntervaloDias, proximaRevisao } = window.calcularSM2(
        card.ef            ?? 2.5,
        card.repeticoes    ?? 0,
        card.intervalo_dias ?? 1,
        qualidade
      );

      // proximaRevisao pode vir como Date ou string — normaliza para 'YYYY-MM-DD'
      const proximaStr = proximaRevisao instanceof Date
        ? proximaRevisao.toISOString().split('T')[0]
        : String(proximaRevisao).split('T')[0];

      const { error } = await window.sb
        .from('revisao_espacada')
        .update({
          ef:               novoEf,
          repeticoes:       novasRepeticoes,
          intervalo_dias:   novoIntervaloDias,
          proxima_revisao:  proximaStr,
          updated_at:       window.now()
        })
        .eq('uuid', card.uuid);

      if (error) {
        console.error('avaliar card:', error.message);
        toast('Erro ao salvar avaliação.', 'erro');
        document.querySelectorAll('.btn-qual').forEach(b => { b.disabled = false; });
        return;
      }

      if (qualidade >= 2) acertos++;
      indice++;

      // Próximo card ou conclusão
      if (indice >= fila.length) {
        mostrarConclusao();
      } else {
        mostrarCardAtual();
        document.querySelectorAll('.btn-qual').forEach(b => { b.disabled = false; });
      }
    }

    // ── Tela de conclusão ─────────────────────────
    function mostrarConclusao() {
      const totalMs  = Date.now() - inicioSessao;
      const minutos  = Math.round(totalMs / 60000);
      const tempoStr = minutos < 1 ? '<1m' : `${minutos}m`;

      document.getElementById('stat-revisados').textContent = fila.length;
      document.getElementById('stat-acertos').textContent   = acertos;
      document.getElementById('stat-tempo').textContent     = tempoStr;

      const proxTotal = todosCards.filter(c =>
        c.proxima_revisao && c.proxima_revisao > hojeStr
      ).length;
      document.getElementById('concluido-sub').textContent =
        proxTotal > 0
          ? `${proxTotal} card${proxTotal !== 1 ? 's' : ''} agendado${proxTotal !== 1 ? 's' : ''} para próximas revisões.`
          : 'Continue adicionando novos cards.';

      // Atualiza lista geral
      carregarCards().then(renderListaCards);
      mostrarView('view-concluido');
    }

    // ── Criar novo card ───────────────────────────
    async function criarCard() {
      const frente = document.getElementById('input-frente').value.trim();
      const verso  = document.getElementById('input-verso').value.trim();

      if (!frente) { toast('Informe a frente do card.', 'erro'); return; }
      if (!verso)  { toast('Informe o verso do card.', 'erro');  return; }

      const btn = document.getElementById('btn-salvar-card');
      btn.disabled = true;

      const { error } = await window.sb
        .from('revisao_espacada')
        .insert({
          uuid:            crypto.randomUUID(),
          user_id:         userId,
          pergunta:        frente,
          resposta:        verso,
          intervalo_dias:  0,
          ef:              2.5,
          proxima_revisao: hojeStr,   // novo card: revisão começa hoje
          updated_at:      window.now()
        });

      btn.disabled = false;

      if (error) { console.error(error); toast('Erro ao criar card.', 'erro'); return; }

      document.getElementById('input-frente').value = '';
      document.getElementById('input-verso').value  = '';
      fecharModal('modal-card');
      toast('Card criado!');

      await carregarCards();
      renderListaCards();

      // Se estava na tela "vazio" ou "concluído", relançar revisão com o novo card
      if (fila.length === 0) iniciarRevisao();
    }

    // ── Excluir card ──────────────────────────────
    async function deletarCard(uuid) {
      await window.softDelete('revisao_espacada', uuid);
      todosCards = todosCards.filter(c => c.uuid !== uuid);
      renderListaCards();
      toast('Card excluído.');
    }

    // ── Renderizar lista de gerenciamento ─────────
    function renderListaCards() {
      const lista = document.getElementById('cards-lista');
      const vazio = document.getElementById('cards-vazio');

      if (todosCards.length === 0) {
        lista.innerHTML = '';
        vazio.style.display = '';
        return;
      }

      vazio.style.display = 'none';
      lista.innerHTML = todosCards.map(c => {
        const vence = !c.proxima_revisao || c.proxima_revisao <= hojeStr;
        const proximaLabel = c.proxima_revisao
          ? new Date(`${c.proxima_revisao}T12:00:00`)
              .toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' })
          : 'Hoje';

        return `
          <div class="card-item">
            <div class="card-item-textos">
              <span class="card-frente-preview">${esc(c.pergunta)}</span>
              <div class="card-meta">
                <span class="card-meta-item${vence ? ' card-proxima-hoje' : ''}">
                  ${vence ? '⚡ Vence hoje' : `próxima: ${proximaLabel}`}
                </span>
                <span class="card-meta-item">
                  ${c.intervalo_dias ?? 0}d · ef ${(c.ef ?? 2.5).toFixed(1)}
                </span>
              </div>
            </div>
            <button class="btn-del-card"
              data-uuid="${esc(c.uuid)}"
              title="Excluir card">✕</button>
          </div>`;
      }).join('');
    }

    // ── Utilitários ───────────────────────────────
    function mostrarView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('ativa'));
      document.getElementById(id).classList.add('ativa');
    }

    function esc(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
    }

    function toast(msg, tipo = 'ok') {
      document.querySelectorAll('.toast').forEach(t => t.remove());
      const el = document.createElement('div');
      el.className   = `toast ${tipo}`;
      el.textContent = msg;
      document.body.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, 3000);
    }

    function fecharModal(id) {
      const el = document.getElementById(id);
      el.style.display = 'none';
      el.classList.remove('open');
    }

    // ── Eventos ───────────────────────────────────
    function bindEventos() {
      // Revelar verso
      document.getElementById('btn-revelar').addEventListener('click', revelarVerso);

      // Qualidade (delegação no verso-wrap)
      document.getElementById('verso-wrap').addEventListener('click', e => {
        const btn = e.target.closest('.btn-qual');
        if (btn) avaliarCard(parseInt(btn.dataset.q, 10));
      });

      // Abrir modal de novo card
      document.getElementById('btn-novo-card').addEventListener('click', () => {
        const el = document.getElementById('modal-card');
        el.style.display = '';
        el.classList.add('open');
        setTimeout(() => document.getElementById('input-frente').focus(), 50);
      });

      // Salvar card
      document.getElementById('btn-salvar-card').addEventListener('click', criarCard);

      // Ctrl+Enter salva no modal
      document.getElementById('input-verso').addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) criarCard();
      });

      // Deletar card (delegação na lista)
      document.getElementById('cards-lista').addEventListener('click', e => {
        const btn = e.target.closest('.btn-del-card');
        if (btn) deletarCard(btn.dataset.uuid);
      });

      // Fechar modais
      document.querySelectorAll('[data-fechar]').forEach(el =>
        el.addEventListener('click', () => fecharModal(el.dataset.fechar))
      );
      document.getElementById('modal-card').addEventListener('click', e => {
        if (e.target === document.getElementById('modal-card')) fecharModal('modal-card');
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') fecharModal('modal-card');
      });
    }
  </script>

</body>
</html>
