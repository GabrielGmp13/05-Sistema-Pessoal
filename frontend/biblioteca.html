<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca — Sistema Pessoal</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  /* ===== Biblioteca — classes prefixadas .bib- (page-specific), ver NAMING_CONVENTIONS.md ===== */

  .bib-pills {
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }
  .bib-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    color: #888;
    border-radius: 999px;
    padding: .4rem .9rem;
    font-size: .8rem;
    cursor: pointer;
    transition: border-color .12s, color .12s;
    white-space: nowrap;
  }
  .bib-pill:hover { border-color: var(--accent); color: var(--text); }
  .bib-pill.ativa { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }

  .bib-toolbar {
    display: flex;
    gap: .75rem;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .bib-toolbar input[type="search"] {
    flex: 1;
    min-width: 180px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .55rem .75rem;
    color: var(--text);
    font-size: .85rem;
  }
  .bib-toolbar select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .55rem .75rem;
    color: var(--text);
    font-size: .82rem;
  }

  .bib-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1rem;
  }
  .bib-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .12s, border-color .12s;
    display: flex;
    flex-direction: column;
  }
  .bib-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .bib-card-capa {
    width: 100%;
    aspect-ratio: 2/3;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    overflow: hidden;
  }
  .bib-card-capa img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bib-card-body { padding: .65rem .75rem .8rem; display: flex; flex-direction: column; gap: .3rem; flex: 1; }
  .bib-card-titulo {
    font-family: 'Syne', sans-serif;
    font-size: .88rem;
    font-weight: 700;
    line-height: 1.25;
    color: var(--text);
  }
  .bib-card-autor { font-size: .72rem; color: #888; }
  .bib-card-meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; font-size: .68rem; }
  .bib-badge-status {
    padding: .15rem .5rem;
    border-radius: 999px;
    font-size: .62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .02em;
  }
  .bib-badge-nota {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
    font-weight: 700;
  }
  .bib-card-tags { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .2rem; }
  .bib-tag-chip {
    font-size: .62rem;
    color: #888;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: .1rem .45rem;
  }

  .bib-vazio { text-align: center; padding: 3rem 1rem; color: #555; }
  .bib-vazio p { margin-bottom: 1rem; font-size: .85rem; }

  .bib-fab {
    position: fixed;
    bottom: 1.75rem;
    right: 1.75rem;
    width: 3.2rem;
    height: 3.2rem;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-size: 1.6rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    z-index: 40;
  }

  .bib-form-row { display: flex; flex-direction: column; gap: .35rem; margin-bottom: .9rem; }
  .bib-form-row label { font-size: .72rem; color: #888; }
  .bib-form-row-dupla { display: flex; gap: .75rem; }
  .bib-form-row-dupla > div { flex: 1; display: flex; flex-direction: column; gap: .35rem; }

  .bib-tipo-selector { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .bib-tipo-opt {
    flex: 1;
    min-width: 70px;
    text-align: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .5rem .3rem;
    cursor: pointer;
    font-size: .68rem;
    color: #888;
  }
  .bib-tipo-opt.ativa { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .bib-tipo-opt[disabled] { opacity: .4; pointer-events: none; }

  .bib-tags-box {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
    max-height: 130px;
    overflow-y: auto;
    padding: .5rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .bib-tag-option {
    display: flex;
    align-items: center;
    gap: .3rem;
    font-size: .75rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: .2rem .6rem .2rem .4rem;
    cursor: pointer;
  }
  .bib-tag-option input { accent-color: var(--accent); }

  .bib-nova-tag { display: flex; gap: .5rem; margin-top: .5rem; }
  .bib-nova-tag input { flex: 1; }

  .bib-capa-preview {
    width: 90px;
    height: 130px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin-bottom: .5rem;
  }
  .bib-capa-preview img { width: 100%; height: 100%; object-fit: cover; }

  .bib-busca-resultados {
    margin-top: .4rem;
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
  }
  .bib-busca-item {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .4rem .6rem;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .bib-busca-item:last-child { border-bottom: none; }
  .bib-busca-item:hover { background: var(--surface); }
  .bib-busca-item img {
    width: 32px; height: 46px; object-fit: cover; border-radius: 4px; background: var(--surface); flex-shrink: 0;
  }
  .bib-busca-item span { font-size: .78rem; color: var(--text); line-height: 1.2; }
  .bib-busca-loading { padding: .5rem .6rem; font-size: .75rem; color: #555; }

  .bib-loading { text-align: center; padding: 2rem; color: #555; font-size: .82rem; }

  @media (max-width: 680px) {
    .bib-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .bib-form-row-dupla { flex-direction: column; }
  }
</style>
</head>

<nav class="nav">
  <a href="index.html" class="nav-logo">SP</a>
  <div class="nav-links">
    <a href="index.html">Dashboard</a>

<div class="container">
  <h1 style="font-family:'Syne',sans-serif; font-size:1.4rem; margin-bottom:.25rem;">Biblioteca</h1>
  <p style="color:#888; font-size:.82rem; margin-bottom:1.5rem;">Catálogo pessoal — livros, filmes, séries, mangás e podcasts.</p>

  <div class="bib-pills" id="bibPills"></div>

  <div class="bib-toolbar">
    <input type="search" id="bibBusca" placeholder="Buscar por título...">
    <select id="bibFiltroStatus">
      <option value="">Todos os status</option>
    </select>

</div>

<button class="bib-fab" onclick="abrirModalItem()" title="Adicionar item">+</button>

<!-- Modal: criar/editar item -->
<div class="modal-overlay" id="bibModalItemOverlay" style="display:none;" onclick="if(event.target===this) fecharModal('bibModalItemOverlay')">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <span id="bibModalTitulo">Adicionar item</span>
      <button class="btn-icon" onclick="fecharModal('bibModalItemOverlay')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="bibItemUuid">

      <div class="bib-tipo-selector" id="bibTipoSelector"></div>

      <div class="bib-form-row">
        <label>Título *</label>
        <input type="text" id="bibTitulo" class="form-control" placeholder="Título">
        <div id="bibBuscaResultados" class="bib-busca-resultados" style="display:none;"></div>
      </div>

      <div class="bib-form-row" id="bibAutorRow" style="display:none;">
        <label id="bibAutorLabel">Autor</label>
        <input type="text" id="bibAutor" class="form-control">
      </div>

      <div class="bib-form-row">
        <label>Status</label>
        <select id="bibStatus" class="form-control"></select>
      </div>

      <div class="bib-form-row-dupla" id="bibProgressoRow" style="display:none;">
        <div id="bibProgExtraWrap" style="display:none;">
          <label id="bibProgExtraLabel">Temporada</label>
          <input type="number" id="bibProgExtra" class="form-control" min="0" inputmode="numeric">
        </div>
        <div>
          <label id="bibProgAtualLabel">Progresso</label>
          <input type="number" id="bibProgAtual" class="form-control" min="0" inputmode="numeric">
        </div>
        <div id="bibProgTotalWrap" style="display:none;">
          <label>Total</label>
          <input type="number" id="bibProgTotal" class="form-control" min="0" inputmode="numeric">
        </div>
      </div>

      <div class="bib-form-row">
        <label>Nota (1-10)</label>
        <input type="number" id="bibNota" class="form-control" min="1" max="10" inputmode="numeric">
      </div>

      <div class="bib-form-row-dupla">
        <div>
          <label>Data início</label>
          <input type="date" id="bibDataInicio" class="form-control">
        </div>
        <div>
          <label>Data fim</label>
          <input type="date" id="bibDataFim" class="form-control">
        </div>
      </div>

      <div class="bib-form-row">
        <label>Comentário</label>
        <textarea id="bibComentario" class="form-control" rows="2"></textarea>
      </div>

      <div class="bib-form-row" id="bibIdExternoRow" style="display:none;">
        <label id="bibIdExternoLabel">ID externo</label>
        <input type="text" id="bibIdExterno" class="form-control">
      </div>

      <div class="bib-form-row" id="bibCapaUrlRow" style="display:none;">
        <label>URL da capa</label>
        <input type="text" id="bibCapaUrl" class="form-control" placeholder="https://...">
      </div>

      <div class="bib-form-row">
        <label>Capa manual (usada só se não houver URL acima)</label>
        <div class="bib-capa-preview" id="bibCapaPreview">🖼️</div>
        <input type="file" id="bibCapaArquivo" accept="image/jpeg,image/png,image/webp">
      </div>

      <div class="bib-form-row">
        <label>Tags</label>
        <div class="bib-tags-box" id="bibTagsBox"></div>
        <div class="bib-nova-tag">
          <input type="text" id="bibNovaTagInput" class="form-control" placeholder="Nova tag...">
          <button class="btn-sm" onclick="criarTagNova()">Criar</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="fecharModal('bibModalItemOverlay')">Cancelar</button>
      <button class="btn-salvar" id="bibBtnSalvar" onclick="salvarItem()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: confirmação de exclusão -->
<div class="modal-overlay" id="bibModalExcluirOverlay" style="display:none;" onclick="if(event.target===this) fecharModal('bibModalExcluirOverlay')">
  <div class="modal" style="max-width:320px;">
    <div class="modal-header">
      <span>Excluir item</span>
      <button class="btn-icon" onclick="fecharModal('bibModalExcluirOverlay')">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:.85rem; color:#888;">Tem certeza? Esta ação move o item para excluído (soft delete).</p>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="fecharModal('bibModalExcluirOverlay')">Cancelar</button>
      <button class="btn-danger" onclick="confirmarExclusao()">Excluir</button>
    </div>
  </div>
</div>

<div id="bibToast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase.js"></script>

<script>
'use strict';

// ============ Configuração por tipo — ver DATABASE.md → Schema 003_biblioteca.sql ============
const TIPOS = {
  livros: {
    tabela: 'livros', tabelaTags: 'livros_tags', fkTag: 'livro_uuid',
    label: 'Livro', labelPlural: 'Livros', icone: '📖',
    campoAutor: 'autor', labelAutor: 'Autor',
    temCapaUrl: true,
    progresso: { atual: 'pagina_atual', atualLabel: 'Página atual', total: 'paginas_total', extra: null },
    idExterno: { campo: 'google_books_id', label: 'Google Books ID' },
    status: [
      { v: 'quero_ler', l: 'Quero ler' },
      { v: 'lendo', l: 'Lendo' },
      { v: 'lido', l: 'Lido' },
      { v: 'pausado', l: 'Pausado' },
      { v: 'abandonado', l: 'Abandonado' }
    ],
    statusDefault: 'quero_ler'
  },
  filmes: {
    tabela: 'filmes', tabelaTags: 'filmes_tags', fkTag: 'filme_uuid',
    label: 'Filme', labelPlural: 'Filmes', icone: '🎬',
    campoAutor: 'diretor', labelAutor: 'Direção',
    temCapaUrl: true,
    progresso: null,
    idExterno: { campo: 'tmdb_id', label: 'TMDB ID' },
    status: [
      { v: 'quero_ver', l: 'Quero ver' },
      { v: 'assistido', l: 'Assistido' },
      { v: 'abandonado', l: 'Abandonado' }
    ],
    statusDefault: 'quero_ver'
  },
  series: {
    tabela: 'series', tabelaTags: 'series_tags', fkTag: 'serie_uuid',
    label: 'Série', labelPlural: 'Séries', icone: '📺',
    campoAutor: 'diretor', labelAutor: 'Direção/Criação',
    temCapaUrl: true,
    progresso: { atual: 'episodio_atual', atualLabel: 'Episódio atual', total: null, extra: { campo: 'temporada_atual', label: 'Temporada' } },
    idExterno: { campo: 'tmdb_id', label: 'TMDB ID' },
    status: [
      { v: 'quero_ver', l: 'Quero ver' },
      { v: 'assistindo', l: 'Assistindo' },
      { v: 'assistido', l: 'Assistido' },
      { v: 'pausado', l: 'Pausado' },
      { v: 'abandonado', l: 'Abandonado' }
    ],
    statusDefault: 'quero_ver'
  },
  mangas: {
    tabela: 'mangas', tabelaTags: 'mangas_tags', fkTag: 'manga_uuid',
    label: 'Mangá', labelPlural: 'Mangás', icone: '📔',
    campoAutor: 'autor', labelAutor: 'Autor',
    temCapaUrl: true,
    progresso: { atual: 'capitulo_atual', atualLabel: 'Capítulo atual', total: null, extra: null },
    idExterno: { campo: 'mal_id', label: 'MyAnimeList ID' },
    status: [
      { v: 'quero_ler', l: 'Quero ler' },
      { v: 'lendo', l: 'Lendo' },
      { v: 'lido', l: 'Lido' },
      { v: 'pausado', l: 'Pausado' },
      { v: 'abandonado', l: 'Abandonado' }
    ],
    statusDefault: 'quero_ler'
  },
  podcasts: {
    tabela: 'podcasts', tabelaTags: 'podcasts_tags', fkTag: 'podcast_uuid',
    label: 'Podcast', labelPlural: 'Podcasts', icone: '🎙️',
    campoAutor: null, labelAutor: null,
    temCapaUrl: true,
    progresso: { atual: 'episodio_atual', atualLabel: 'Episódio atual', total: null, extra: null },
    idExterno: { campo: 'itunes_id', label: 'iTunes ID' },
    status: [
      { v: 'quero_ouvir', l: 'Quero ouvir' },
      { v: 'ouvindo', l: 'Ouvindo' },
      { v: 'concluido', l: 'Concluído' },
      { v: 'pausado', l: 'Pausado' },
      { v: 'abandonado', l: 'Abandonado' }
    ],
    statusDefault: 'ouvindo'
  }
};

const CORES_STATUS = {
  quero_ler: '#555', quero_ver: '#555', quero_ouvir: '#555',
  lendo: '#63b3ed', assistindo: '#63b3ed', ouvindo: '#63b3ed',
  lido: '#4ade80', assistido: '#4ade80', concluido: '#4ade80',
  pausado: '#fb923c',
  abandonado: '#ff6b6b'
};

// ============ Busca de metadados — TMDB, Google Books, Jikan, iTunes ============
// COLOQUE SUA CHAVE do TMDB aqui (gratuita — cadastro em themoviedb.org/settings/api)
const TMDB_API_KEY = '098ba4ea25ab03a61c92aaf306ef5e0b';

const BUSCA_API = {
  livros: async (q) => {
    const r = await fetch('https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(q) + '&maxResults=8');
    const data = await r.json();
    return (data.items || []).map(item => ({
      idExterno: item.id,
      titulo: item.volumeInfo.title || '',
      autor: (item.volumeInfo.authors || []).join(', '),
      capaUrl: item.volumeInfo.imageLinks ? item.volumeInfo.imageLinks.thumbnail.replace('http://', 'https://') : ''
    }));
  },
  filmes: async (q) => {
    if (TMDB_API_KEY === 'COLOQUE_SUA_CHAVE_TMDB_AQUI') { toast('Configure TMDB_API_KEY no código antes de buscar filmes', 'erro'); return []; }
    const r = await fetch('https://api.themoviedb.org/3/search/movie?query=' + encodeURIComponent(q) + '&api_key=' + TMDB_API_KEY + '&language=pt-BR');
    const data = await r.json();
    return (data.results || []).slice(0, 8).map(item => ({
      idExterno: String(item.id),
      titulo: item.title || '',
      autor: '',
      capaUrl: item.poster_path ? 'https://image.tmdb.org/t/p/w342' + item.poster_path : ''
    }));
  },
  series: async (q) => {
    if (TMDB_API_KEY === 'COLOQUE_SUA_CHAVE_TMDB_AQUI') { toast('Configure TMDB_API_KEY no código antes de buscar séries', 'erro'); return []; }
    const r = await fetch('https://api.themoviedb.org/3/search/tv?query=' + encodeURIComponent(q) + '&api_key=' + TMDB_API_KEY + '&language=pt-BR');
    const data = await r.json();
    return (data.results || []).slice(0, 8).map(item => ({
      idExterno: String(item.id),
      titulo: item.name || '',
      autor: '',
      capaUrl: item.poster_path ? 'https://image.tmdb.org/t/p/w342' + item.poster_path : ''
    }));
  },
  mangas: async (q) => {
    const r = await fetch('https://api.jikan.moe/v4/manga?q=' + encodeURIComponent(q) + '&limit=8');
    const data = await r.json();
    return (data.data || []).map(item => ({
      idExterno: String(item.mal_id),
      titulo: item.title || '',
      autor: (item.authors || []).map(a => a.name).join(', '),
      capaUrl: item.images && item.images.jpg ? item.images.jpg.image_url : ''
    }));
  },
  podcasts: async (q) => {
    const r = await fetch('https://itunes.apple.com/search?term=' + encodeURIComponent(q) + '&entity=podcast&limit=8');
    const data = await r.json();
    return (data.results || []).map(item => ({
      idExterno: String(item.trackId),
      titulo: item.trackName || '',
      autor: item.artistName || '',
      capaUrl: item.artworkUrl600 || ''
    }));
  }
};

function debounce(fn, ms) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
}

let itens = [];
let todasTags = [];
let itemTags = {};       // `${tipo}:${uuid}` -> [tagUuid,...]
let capaCache = {};      // `${tipo}:${uuid}` -> url resolvida
let filtroTipoAtual = 'todas';
let uuidParaExcluir = null;
let tipoParaExcluir = null;

function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function toast(msg, tipo) {
  const el = document.createElement('div');
  el.className = 'toast ' + (tipo === 'erro' ? 'erro' : 'ok');
  el.style.cssText = 'position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid ' + (tipo === 'erro' ? '#ff6b6b' : 'var(--accent)') + ';border-radius:8px;padding:.7rem 1.2rem;font-size:.82rem;z-index:200;';
  el.textContent = msg;
  document.getElementById('bibToast').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function abrirModal(id) { const el = document.getElementById(id); el.style.display = 'flex'; el.classList.add('open'); }
function fecharModal(id) { const el = document.getElementById(id); el.style.display = 'none'; el.classList.remove('open'); }

// ============ Carregamento ============

async function carregarTudo() {
  document.getElementById('bibConteudo').innerHTML = '<div class="bib-loading">Carregando...</div>';

  const chaves = Object.keys(TIPOS);
  const resultados = await Promise.all(
    chaves.map(t => window.sb.from(TIPOS[t].tabela).select('*').eq('deleted', false).order('updated_at', { ascending: false }))
  );

  itens = [];
  chaves.forEach((t, i) => {
    const { data, error } = resultados[i];
    if (error) { window.sbErr(error, 'carregarTudo:' + t); return; }
    (data || []).forEach(row => itens.push(Object.assign({ _tipo: t }, row)));
  });

  await carregarTags();
  await resolverCapas(itens);
  renderPills();
  renderFiltroStatus();
  renderGrid();
}

async function carregarTags() {
  const { data: tagsData, error } = await window.sb.from('tags').select('*').eq('deleted', false).order('nome');
  if (error) { window.sbErr(error, 'carregarTags'); return; }
  todasTags = tagsData || [];

  itemTags = {};
  const chaves = Object.keys(TIPOS);
  const resultados = await Promise.all(
    chaves.map(t => window.sb.from(TIPOS[t].tabelaTags).select('*').eq('deleted', false))
  );
  chaves.forEach((t, i) => {
    const cfg = TIPOS[t];
    const { data, error: err } = resultados[i];
    if (err) { window.sbErr(err, 'carregarTags:' + t); return; }
    (data || []).forEach(row => {
      const key = t + ':' + row[cfg.fkTag];
      if (!itemTags[key]) itemTags[key] = [];
      itemTags[key].push(row.tag_uuid);
    });
  });
}

async function resolverCapas(lista) {
  await Promise.all(lista.map(async item => {
    const key = item._tipo + ':' + item.uuid;
    if (capaCache[key]) return;
    if (item.capa_url) { capaCache[key] = item.capa_url; return; }
    if (item.capa_path) {
      const url = await window.getSignedUrl('capas', item.capa_path);
      if (url) capaCache[key] = url;
    }
  }));
}

// ============ Render ============

function renderPills() {
  const wrap = document.getElementById('bibPills');
  let html = '<button class="bib-pill ' + (filtroTipoAtual === 'todas' ? 'ativa' : '') + '" onclick="mudarFiltroTipo(\'todas\')">Todas (' + itens.length + ')</button>';
  Object.keys(TIPOS).forEach(t => {
    const cfg = TIPOS[t];
    const qtd = itens.filter(i => i._tipo === t).length;
    html += '<button class="bib-pill ' + (filtroTipoAtual === t ? 'ativa' : '') + '" onclick="mudarFiltroTipo(\'' + t + '\')">' + cfg.icone + ' ' + cfg.labelPlural + ' (' + qtd + ')</button>';
  });
  wrap.innerHTML = html;
}

function renderFiltroStatus() {
  const sel = document.getElementById('bibFiltroStatus');
  const atual = sel.value;
  let opcoes = '<option value="">Todos os status</option>';
  const statusVistos = new Set();
  const tiposConsiderados = filtroTipoAtual === 'todas' ? Object.keys(TIPOS) : [filtroTipoAtual];
  tiposConsiderados.forEach(t => {
    TIPOS[t].status.forEach(s => {
      if (!statusVistos.has(s.v)) {
        statusVistos.add(s.v);
        opcoes += '<option value="' + s.v + '">' + esc(s.l) + '</option>';
      }
    });
  });
  sel.innerHTML = opcoes;
  sel.value = atual && statusVistos.has(atual) ? atual : '';
}

function mudarFiltroTipo(t) {
  filtroTipoAtual = t;
  renderPills();
  renderFiltroStatus();
  renderGrid();
}

function renderGrid() {
  const busca = document.getElementById('bibBusca').value.trim().toLowerCase();
  const statusFiltro = document.getElementById('bibFiltroStatus').value;

  let lista = itens.filter(i => {
    if (filtroTipoAtual !== 'todas' && i._tipo !== filtroTipoAtual) return false;
    if (statusFiltro && i.status !== statusFiltro) return false;
    if (busca && !i.titulo.toLowerCase().includes(busca)) return false;
    return true;
  });

  const conteudo = document.getElementById('bibConteudo');

  if (lista.length === 0) {
    conteudo.innerHTML = '<div class="bib-vazio"><p>Nenhum item encontrado.</p><button class="btn-sm" onclick="abrirModalItem()">+ Adicionar item</button></div>';
    return;
  }

  let html = '<div class="bib-grid">';
  lista.forEach(item => {
    const cfg = TIPOS[item._tipo];
    const key = item._tipo + ':' + item.uuid;
    const capaUrl = capaCache[key];
    const statusObj = cfg.status.find(s => s.v === item.status);
    const statusLabel = statusObj ? statusObj.l : item.status;
    const cor = CORES_STATUS[item.status] || '#555';
    const tagsDoItem = (itemTags[key] || []).map(tu => todasTags.find(t => t.uuid === tu)).filter(Boolean);

    html += '<div class="bib-card" onclick="abrirModalItem(\'' + item._tipo + '\',\'' + item.uuid + '\')">';
    html += '<div class="bib-card-capa">' + (capaUrl ? '<img src="' + esc(capaUrl) + '" alt="">' : cfg.icone) + '</div>';
    html += '<div class="bib-card-body">';
    html += '<div class="bib-card-titulo">' + esc(item.titulo) + '</div>';
    if (cfg.campoAutor && item[cfg.campoAutor]) {
      html += '<div class="bib-card-autor">' + esc(item[cfg.campoAutor]) + '</div>';
    }
    if (tagsDoItem.length) {
      html += '<div class="bib-card-tags">' + tagsDoItem.map(t => '<span class="bib-tag-chip">' + esc(t.nome) + '</span>').join('') + '</div>';
    }
    html += '<div class="bib-card-meta">';
    html += '<span class="bib-badge-status" style="background:' + cor + '22; color:' + cor + ';">' + esc(statusLabel) + '</span>';
    html += item.nota ? '<span class="bib-badge-nota">★ ' + esc(item.nota) + '</span>' : '<span></span>';
    html += '</div></div></div>';
  });
  html += '</div>';
  conteudo.innerHTML = html;
}

document.getElementById('bibBusca').addEventListener('input', renderGrid);
document.getElementById('bibFiltroStatus').addEventListener('change', renderGrid);

// ============ Modal item ============

let tipoModalAtual = null;

function abrirModalItem(tipo, uuid) {
  document.getElementById('bibItemUuid').value = uuid || '';
  document.getElementById('bibModalTitulo').textContent = uuid ? 'Editar item' : 'Adicionar item';

  const tipoInicial = tipo || filtroTipoAtual !== 'todas' && filtroTipoAtual || 'livros';
  renderTipoSelector(tipoInicial, !!uuid);
  selecionarTipoModal(tipoInicial);

  if (uuid) {
    const item = itens.find(i => i._tipo === tipo && i.uuid === uuid);
    if (item) preencherFormulario(tipo, item);
  } else {
    limparFormulario();
  }

  renderTagsBox(tipo || tipoInicial, uuid);
  abrirModal('bibModalItemOverlay');
}

function renderTipoSelector(tipoAtivo, travado) {
  const wrap = document.getElementById('bibTipoSelector');
  let html = '';
  Object.keys(TIPOS).forEach(t => {
    const cfg = TIPOS[t];
    html += '<div class="bib-tipo-opt ' + (t === tipoAtivo ? 'ativa' : '') + '" ' + (travado ? 'disabled' : '') + ' onclick="selecionarTipoModal(\'' + t + '\')" data-tipo="' + t + '">' + cfg.icone + '<br>' + cfg.labelPlural + '</div>';
  });
  wrap.innerHTML = html;
}

function selecionarTipoModal(tipo) {
  tipoModalAtual = tipo;
  const cfg = TIPOS[tipo];

  document.querySelectorAll('.bib-tipo-opt').forEach(el => el.classList.toggle('ativa', el.dataset.tipo === tipo));

  // Autor/Diretor
  const autorRow = document.getElementById('bibAutorRow');
  if (cfg.campoAutor) {
    autorRow.style.display = 'flex';
    document.getElementById('bibAutorLabel').textContent = cfg.labelAutor;
  } else {
    autorRow.style.display = 'none';
  }

  // Status
  const statusSel = document.getElementById('bibStatus');
  statusSel.innerHTML = cfg.status.map(s => '<option value="' + s.v + '">' + esc(s.l) + '</option>').join('');
  statusSel.value = cfg.statusDefault;

  // Progresso
  const progRow = document.getElementById('bibProgressoRow');
  if (cfg.progresso) {
    progRow.style.display = 'flex';
    document.getElementById('bibProgAtualLabel').textContent = cfg.progresso.atualLabel;
    document.getElementById('bibProgTotalWrap').style.display = cfg.progresso.total ? 'block' : 'none';
    const extraWrap = document.getElementById('bibProgExtraWrap');
    if (cfg.progresso.extra) {
      extraWrap.style.display = 'block';
      document.getElementById('bibProgExtraLabel').textContent = cfg.progresso.extra.label;
    } else {
      extraWrap.style.display = 'none';
    }
  } else {
    progRow.style.display = 'none';
  }

  // ID externo
  const idRow = document.getElementById('bibIdExternoRow');
  if (cfg.idExterno) {
    idRow.style.display = 'flex';
    document.getElementById('bibIdExternoLabel').textContent = cfg.idExterno.label;
  } else {
    idRow.style.display = 'none';
  }

  // Capa URL
  document.getElementById('bibCapaUrlRow').style.display = cfg.temCapaUrl ? 'flex' : 'none';

  renderTagsBox(tipo, document.getElementById('bibItemUuid').value || null);
}

// ============ Busca de metadados na caixa de título ============

let ultimoResultadoBusca = [];

const dispararBuscaMetadados = debounce(async () => {
  const titulo = document.getElementById('bibTitulo').value.trim();
  const box = document.getElementById('bibBuscaResultados');
  if (titulo.length < 3) { box.style.display = 'none'; box.innerHTML = ''; return; }

  const buscaFn = BUSCA_API[tipoModalAtual];
  if (!buscaFn) { box.style.display = 'none'; return; }

  box.style.display = 'block';
  box.innerHTML = '<div class="bib-busca-loading">Buscando...</div>';

  let resultados = [];
  try {
    resultados = await buscaFn(titulo);
  } catch (e) {
    box.innerHTML = '<div class="bib-busca-loading">Erro na busca — tente de novo</div>';
    return;
  }

  ultimoResultadoBusca = resultados;
  if (resultados.length === 0) {
    box.innerHTML = '<div class="bib-busca-loading">Nenhum resultado</div>';
    return;
  }

  box.innerHTML = resultados.map((r, i) =>
    '<div class="bib-busca-item" onclick="selecionarResultadoBusca(' + i + ')">' +
    (r.capaUrl ? '<img src="' + esc(r.capaUrl) + '">' : '<div style="width:32px;height:46px;flex-shrink:0;"></div>') +
    '<span>' + esc(r.titulo) + (r.autor ? ' — ' + esc(r.autor) : '') + '</span>' +
    '</div>'
  ).join('');
}, 500);

function selecionarResultadoBusca(i) {
  const r = ultimoResultadoBusca[i];
  if (!r) return;
  const cfg = TIPOS[tipoModalAtual];

  document.getElementById('bibTitulo').value = r.titulo;
  if (cfg.campoAutor && r.autor) document.getElementById('bibAutor').value = r.autor;
  if (cfg.idExterno) document.getElementById('bibIdExterno').value = r.idExterno || '';
  if (cfg.temCapaUrl) document.getElementById('bibCapaUrl').value = r.capaUrl || '';
  document.getElementById('bibCapaPreview').innerHTML = r.capaUrl ? '<img src="' + esc(r.capaUrl) + '">' : '🖼️';

  // Tipos sem campo de autor dedicado (hoje: podcasts) recebem o autor/produtora da API em comentario
  if (!cfg.campoAutor && r.autor) {
    const comentarioEl = document.getElementById('bibComentario');
    if (!comentarioEl.value.trim()) comentarioEl.value = 'Produtora: ' + r.autor;
  }

  document.getElementById('bibBuscaResultados').style.display = 'none';
  document.getElementById('bibBuscaResultados').innerHTML = '';
}

document.getElementById('bibTitulo').addEventListener('input', dispararBuscaMetadados);



function limparFormulario() {
  document.getElementById('bibTitulo').value = '';
  document.getElementById('bibAutor').value = '';
  document.getElementById('bibNota').value = '';
  document.getElementById('bibDataInicio').value = '';
  document.getElementById('bibDataFim').value = '';
  document.getElementById('bibComentario').value = '';
  document.getElementById('bibIdExterno').value = '';
  document.getElementById('bibCapaUrl').value = '';
  document.getElementById('bibCapaArquivo').value = '';
  document.getElementById('bibProgAtual').value = '';
  document.getElementById('bibProgTotal').value = '';
  document.getElementById('bibProgExtra').value = '';
  document.getElementById('bibCapaPreview').innerHTML = '🖼️';
}

function preencherFormulario(tipo, item) {
  const cfg = TIPOS[tipo];
  document.getElementById('bibTitulo').value = item.titulo || '';
  document.getElementById('bibBuscaResultados').style.display = 'none';
  document.getElementById('bibBuscaResultados').innerHTML = '';
  document.getElementById('bibAutor').value = cfg.campoAutor ? (item[cfg.campoAutor] || '') : '';
  document.getElementById('bibStatus').value = item.status || cfg.statusDefault;
  document.getElementById('bibNota').value = item.nota || '';
  document.getElementById('bibDataInicio').value = item.data_inicio || '';
  document.getElementById('bibDataFim').value = item.data_fim || '';
  document.getElementById('bibComentario').value = item.comentario || '';
  document.getElementById('bibIdExterno').value = cfg.idExterno ? (item[cfg.idExterno.campo] || '') : '';
  document.getElementById('bibCapaUrl').value = cfg.temCapaUrl ? (item.capa_url || '') : '';
  document.getElementById('bibCapaArquivo').value = '';

  if (cfg.progresso) {
    document.getElementById('bibProgAtual').value = item[cfg.progresso.atual] || 0;
    if (cfg.progresso.total) document.getElementById('bibProgTotal').value = item[cfg.progresso.total] || '';
    if (cfg.progresso.extra) document.getElementById('bibProgExtra').value = item[cfg.progresso.extra.campo] || 1;
  }

  const key = tipo + ':' + item.uuid;
  const capaUrl = capaCache[key];
  document.getElementById('bibCapaPreview').innerHTML = capaUrl ? '<img src="' + esc(capaUrl) + '">' : '🖼️';
}

function renderTagsBox(tipo, itemUuid) {
  const box = document.getElementById('bibTagsBox');
  const selecionadas = itemUuid ? (itemTags[tipo + ':' + itemUuid] || []) : [];
  if (todasTags.length === 0) {
    box.innerHTML = '<span style="font-size:.72rem;color:#555;">Nenhuma tag ainda — crie uma abaixo.</span>';
    return;
  }
  box.innerHTML = todasTags.map(t =>
    '<label class="bib-tag-option"><input type="checkbox" class="bib-tag-check" value="' + t.uuid + '" ' + (selecionadas.includes(t.uuid) ? 'checked' : '') + '> ' + esc(t.nome) + '</label>'
  ).join('');
}

async function criarTagNova() {
  const input = document.getElementById('bibNovaTagInput');
  const nome = input.value.trim();
  if (!nome) return;
  const userId = await window.getUserId();
  const { error } = await window.sb.from('tags').insert({
    uuid: crypto.randomUUID(), user_id: userId, nome,
    updated_at: window.now(), deleted: false
  });
  if (error) { window.sbErr(error, 'criarTagNova'); toast('Erro ao criar tag', 'erro'); return; }
  input.value = '';
  await carregarTags();
  renderTagsBox(tipoModalAtual, document.getElementById('bibItemUuid').value || null);
  toast('Tag criada', 'ok');
}

async function salvarItem() {
  const tipo = tipoModalAtual;
  const cfg = TIPOS[tipo];
  const titulo = document.getElementById('bibTitulo').value.trim();
  if (!titulo) { toast('Título é obrigatório', 'erro'); return; }

  const uuidExistente = document.getElementById('bibItemUuid').value;
  const uuid = uuidExistente || crypto.randomUUID();
  const userId = await window.getUserId();

  const payload = {
    uuid, user_id: userId,
    titulo,
    status: document.getElementById('bibStatus').value,
    nota: document.getElementById('bibNota').value ? parseInt(document.getElementById('bibNota').value, 10) : null,
    comentario: document.getElementById('bibComentario').value.trim() || null,
    data_inicio: document.getElementById('bibDataInicio').value || null,
    data_fim: document.getElementById('bibDataFim').value || null,
    updated_at: window.now(),
    deleted: false
  };

  if (cfg.campoAutor) payload[cfg.campoAutor] = document.getElementById('bibAutor').value.trim() || null;

  if (cfg.progresso) {
    payload[cfg.progresso.atual] = document.getElementById('bibProgAtual').value ? parseInt(document.getElementById('bibProgAtual').value, 10) : 0;
    if (cfg.progresso.total) payload[cfg.progresso.total] = document.getElementById('bibProgTotal').value ? parseInt(document.getElementById('bibProgTotal').value, 10) : null;
    if (cfg.progresso.extra) payload[cfg.progresso.extra.campo] = document.getElementById('bibProgExtra').value ? parseInt(document.getElementById('bibProgExtra').value, 10) : 1;
  }

  if (cfg.idExterno) payload[cfg.idExterno.campo] = document.getElementById('bibIdExterno').value.trim() || null;

  if (cfg.temCapaUrl) {
    const capaUrlInput = document.getElementById('bibCapaUrl').value.trim();
    payload.capa_url = capaUrlInput || null;
  }

  document.getElementById('bibBtnSalvar').disabled = true;

  const fileInput = document.getElementById('bibCapaArquivo');
  if (fileInput.files[0]) {
    const ext = fileInput.files[0].name.split('.').pop();
    const path = userId + '/' + uuid + '-capa.' + ext;
    const savedPath = await window.uploadFile('capas', path, fileInput.files[0]);
    if (savedPath) {
      payload.capa_path = savedPath;
      if (cfg.temCapaUrl && !payload.capa_url) payload.capa_url = null;
    } else {
      toast('Falha no upload da capa — item será salvo sem capa nova', 'erro');
    }
  }

  const { error } = await window.sb.from(cfg.tabela).upsert(payload);
  if (error) {
    window.sbErr(error, 'salvarItem:' + tipo);
    toast('Erro ao salvar', 'erro');
    document.getElementById('bibBtnSalvar').disabled = false;
    return;
  }

  await salvarTags(tipo, uuid);
  document.getElementById('bibBtnSalvar').disabled = false;
  toast('Salvo com sucesso', 'ok');
  fecharModal('bibModalItemOverlay');
  delete capaCache[tipo + ':' + uuid];
  await carregarTudo();
}

async function salvarTags(tipo, itemUuid) {
  const cfg = TIPOS[tipo];
  const userId = await window.getUserId();
  const selecionadas = Array.from(document.querySelectorAll('.bib-tag-check:checked')).map(el => el.value);

  const { data: existentes, error } = await window.sb.from(cfg.tabelaTags).select('*').eq(cfg.fkTag, itemUuid).eq('deleted', false);
  if (error) { window.sbErr(error, 'salvarTags:buscar:' + tipo); return; }

  for (const row of (existentes || [])) {
    await window.sb.from(cfg.tabelaTags).update({ deleted: true, updated_at: window.now() }).eq('uuid', row.uuid);
  }
  for (const tagUuid of selecionadas) {
    await window.sb.from(cfg.tabelaTags).insert({
      uuid: crypto.randomUUID(), user_id: userId,
      [cfg.fkTag]: itemUuid, tag_uuid: tagUuid,
      updated_at: window.now(), deleted: false
    });
  }
}

// ============ Exclusão ============

function pedirExclusao(tipo, uuid) {
  tipoParaExcluir = tipo;
  uuidParaExcluir = uuid;
  fecharModal('bibModalItemOverlay');
  abrirModal('bibModalExcluirOverlay');
}

async function confirmarExclusao() {
  if (!uuidParaExcluir || !tipoParaExcluir) return;
  const cfg = TIPOS[tipoParaExcluir];
  const result = await window.softDelete(cfg.tabela, uuidParaExcluir);
  if (result && result.error) {
    toast('Erro ao excluir', 'erro');
  } else {
    toast('Item excluído', 'ok');
    delete capaCache[tipoParaExcluir + ':' + uuidParaExcluir];
  }
  uuidParaExcluir = null;
  tipoParaExcluir = null;
  fecharModal('bibModalExcluirOverlay');
  await carregarTudo();
}

// Botão de excluir dentro do modal de edição (adicionado dinamicamente quando uuid existe)
const observerModalTitulo = new MutationObserver(() => {
  const footer = document.querySelector('#bibModalItemOverlay .modal-footer');
  const uuid = document.getElementById('bibItemUuid').value;
  let btnExcluir = document.getElementById('bibBtnExcluir');
  if (uuid && !btnExcluir) {
    btnExcluir = document.createElement('button');
    btnExcluir.id = 'bibBtnExcluir';
    btnExcluir.className = 'btn-danger';
    btnExcluir.textContent = 'Excluir';
    btnExcluir.style.marginRight = 'auto';
    btnExcluir.onclick = () => pedirExclusao(tipoModalAtual, uuid);
    footer.insertBefore(btnExcluir, footer.firstChild);
  } else if (!uuid && btnExcluir) {
    btnExcluir.remove();
  }
});
observerModalTitulo.observe(document.getElementById('bibModalTitulo'), { childList: true });

// ============ Init ============

(async () => {
  const session = await window.authReady;
  if (!session) return;
  await carregarTudo();
})();
</script>
</body>
</html>
