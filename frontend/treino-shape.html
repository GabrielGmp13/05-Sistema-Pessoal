<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shape — Sistema Pessoal</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* ── Layout ──────────────────────────────────── */
    .shape-wrap {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.25rem;
      align-items: start;
    }
    .shape-full { grid-column: 1 / -1; }
    @media (max-width: 720px) {
      .shape-wrap { grid-template-columns: 1fr; }
      .shape-full { grid-column: 1; }
    }

    /* ── Page header ─────────────────────────────── */
    .page-header { margin-bottom: 1.25rem; }
    .page-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      margin: 0 0 .2rem;
      color: var(--text);
    }
    .page-header p { margin: 0; font-size: .82rem; color: #555; }

    /* ── Seção header ────────────────────────────── */
    .sec-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .9rem;
    }
    .sec-header h2 {
      font-family: 'Syne', sans-serif;
      font-size: .95rem;
      margin: 0;
      color: var(--text);
    }

    /* ── Formulário de upload ────────────────────── */
    .form-campo { margin-bottom: .85rem; }
    .form-campo label {
      display: block;
      font-size: .75rem;
      color: #777;
      margin-bottom: .3rem;
      letter-spacing: .02em;
    }
    .form-campo input {
      width: 100%;
      box-sizing: border-box;
    }

    /* Área de drop / preview de foto */
    .foto-drop {
      width: 100%;
      aspect-ratio: 3/2;
      border: 2px dashed var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #444;
      font-size: .82rem;
      background: var(--bg);
      background-size: cover;
      background-position: center;
      transition: border-color .15s;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .foto-drop:hover { border-color: #555; }
    .foto-drop.tem-preview { border-style: solid; border-color: var(--border); }
    .foto-drop.tem-preview .foto-drop-label { display: none; }

    .foto-drop-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .4rem;
      pointer-events: none;
    }
    .foto-drop-icon { font-size: 1.6rem; }

    .foto-drop input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .foto-remover {
      position: absolute;
      top: .4rem;
      right: .4rem;
      background: rgba(0,0,0,.6);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: .75rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .foto-drop.tem-preview .foto-remover { display: flex; }

    .btn-salvar {
      width: 100%;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: .65rem;
      font-size: .88rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: .25rem;
      transition: filter .12s;
    }
    .btn-salvar:hover   { filter: brightness(1.1); }
    .btn-salvar:disabled { opacity: .45; cursor: default; filter: none; }

    /* ── Gráfico de peso ─────────────────────────── */
    .chart-wrap {
      position: relative;
      height: 220px;
    }

    /* ── Galeria ─────────────────────────────────── */
    .galeria-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: .85rem;
    }
    @media (max-width: 400px) {
      .galeria-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .shape-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      transition: border-color .15s;
    }
    .shape-card:hover { border-color: #444; }

    .shape-thumb {
      width: 100%;
      aspect-ratio: 3/4;
      background: var(--surface);
      background-size: cover;
      background-position: center top;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: 2rem;
    }

    .shape-info {
      padding: .5rem .6rem;
      display: flex;
      flex-direction: column;
      gap: .1rem;
    }
    .shape-data {
      font-family: 'JetBrains Mono', monospace;
      font-size: .7rem;
      color: #666;
    }
    .shape-peso {
      font-family: 'JetBrains Mono', monospace;
      font-size: .88rem;
      color: var(--accent);
      font-weight: 700;
    }

    .btn-del-shape {
      position: absolute;
      top: .35rem;
      right: .35rem;
      background: rgba(0,0,0,.55);
      border: none;
      border-radius: 50%;
      color: #aaa;
      cursor: pointer;
      width: 22px;
      height: 22px;
      font-size: .7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .12s, background .12s;
      opacity: 0;
    }
    .shape-card:hover .btn-del-shape { opacity: 1; }
    .btn-del-shape:hover { color: #fff; background: rgba(239,68,68,.7); }

    /* ── Vazio / loading ─────────────────────────── */
    .vazio {
      text-align: center;
      color: #444;
      font-size: .82rem;
      padding: 1.5rem;
      line-height: 1.6;
    }
    #loading { text-align: center; padding: 3rem; color: #555; font-size: .9rem; }

    /* ── Toast ───────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(56px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .6rem 1.2rem;
      font-size: .82rem;
      color: var(--text);
      z-index: 200;
      opacity: 0;
      transition: transform .2s ease, opacity .2s ease;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.ok   { border-color: var(--accent); }
    .toast.erro { border-color: #ff6b6b; }

    /* ── Modal ───────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 320px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.1rem .7rem;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 {
      margin: 0;
      font-family: 'Syne', sans-serif;
      font-size: .9rem;
      color: var(--text);
    }
    .modal-close {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: .85rem;
      padding: .2rem;
      transition: color .15s;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: .9rem 1.1rem; }
    .modal-body p { margin: 0; font-size: .87rem; color: var(--text); line-height: 1.55; }
    .modal-footer {
      display: flex;
      gap: .6rem;
      justify-content: flex-end;
      padding: .7rem 1.1rem .9rem;
    }
    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #888;
      cursor: pointer;
      padding: .4rem .8rem;
      font-size: .82rem;
      transition: border-color .12s;
    }
    .btn-ghost:hover { border-color: #555; }
    .btn-danger {
      background: none;
      border: 1px solid #ff6b6b;
      border-radius: 6px;
      color: #ff6b6b;
      cursor: pointer;
      padding: .4rem .8rem;
      font-size: .82rem;
      transition: background .12s;
    }
    .btn-danger:hover { background: rgba(255,107,107,.1); }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">SP</a>
    <div class="nav-links">
      <a href="treino.html">Treinos</a>
      <a href="treino-academia.html">Academia</a>
      <a href="index.html">Dashboard</a>
    </div>
  </nav>

  <main class="container">

    <div class="page-header">
      <h1>Shape</h1>
      <p>Evolução de peso e registros fotográficos</p>
    </div>

    <div id="loading">Carregando…</div>

    <div id="conteudo" style="display:none">

      <div class="shape-wrap">

        <!-- ── Novo registro ──────────────────── -->
        <section class="card">
          <div class="sec-header"><h2>Novo registro</h2></div>

          <div class="form-campo">
            <label for="input-data">Data</label>
            <input type="date" id="input-data">
          </div>

          <div class="form-campo">
            <label for="input-peso">Peso (kg) <span style="color:#555;font-weight:400">(opcional)</span></label>
            <input type="number" id="input-peso" inputmode="decimal"
              min="30" max="300" step="0.1" placeholder="ex: 72.5">
          </div>

          <div class="form-campo">
            <label>Foto <span style="color:#555;font-weight:400">(opcional · máx. 10 MB)</span></label>
            <div class="foto-drop" id="foto-drop">
              <div class="foto-drop-label">
                <span class="foto-drop-icon">📷</span>
                <span>Toque para selecionar</span>
              </div>
              <input type="file" id="input-foto"
                accept="image/jpeg,image/png,image/webp">
              <button type="button" class="foto-remover" id="btn-remover-foto"
                title="Remover foto">✕</button>
            </div>
          </div>

          <button id="btn-salvar" class="btn-salvar">Salvar registro</button>
        </section>

        <!-- ── Gráfico de peso ────────────────── -->
        <section class="card">
          <div class="sec-header"><h2>Evolução de peso</h2></div>
          <div id="chart-wrap" class="chart-wrap">
            <canvas id="peso-chart"></canvas>
          </div>
        </section>

        <!-- ── Galeria ────────────────────────── -->
        <section class="card shape-full">
          <div class="sec-header">
            <h2>Histórico</h2>
            <span id="total-registros" style="font-size:.75rem;color:#555"></span>
          </div>
          <div id="galeria" class="galeria-grid"></div>
        </section>

      </div>
    </div>
  </main>

  <!-- ── Modal de confirmação ───────────────────── -->
  <div id="modal-confirm" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3>Confirmar exclusão</h3>
        <button class="modal-close" data-fechar="modal-confirm" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body">
        <p id="confirm-msg">Excluir este registro?</p>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" data-fechar="modal-confirm">Cancelar</button>
        <button id="btn-confirmar" class="btn-danger">Excluir</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
  <script src="assets/supabase.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    'use strict';

    // ── Estado ────────────────────────────────────
    let userId     = null;
    let registros  = [];          // shape records
    let signedUrls = {};          // { [foto_path]: signedUrl }
    let pesoChart  = null;
    let confirmFn  = null;
    let arquivoSelecionado = null; // File | null

    // ── Bootstrap ─────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      const session = await window.authReady;
      if (!session) return;
      await inicializar(session.user.id);
    });

    async function inicializar(uid) {
      userId = uid;

      // Preenche data de hoje por padrão
      document.getElementById('input-data').value = hojeISO();

      await carregarShape();

      document.getElementById('loading').style.display  = 'none';
      document.getElementById('conteudo').style.display = '';

      bindEventos();
    }

    // ── Utilitários ───────────────────────────────
    function esc(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
    }

    function toast(msg, tipo = 'ok') {
      document.querySelectorAll('.toast').forEach(t => t.remove());
      const el = document.createElement('div');
      el.className   = `toast ${tipo}`;
      el.textContent = msg;
      document.body.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, 3200);
    }

    function hojeISO() {
      return new Date().toISOString().split('T')[0];
    }

    function floatOrNull(val) {
      const v = parseFloat(String(val).replace(',', '.'));
      return isNaN(v) ? null : v;
    }

    // ── Carregar registros ────────────────────────
    async function carregarShape() {
      const { data, error } = await window.sb
        .from('shape')
        .select('*')
        .eq('user_id', userId)
        .eq('deleted', false)
        .order('data', { ascending: false });

      if (error) { console.error('shape:', error.message); return; }
      registros = data ?? [];

      // Gerar signed URLs em lote para todos os registros com foto
      signedUrls = {};
      const comFoto = registros.filter(r => r.foto_path);
      if (comFoto.length > 0) {
        const { data: urls, error: errUrl } = await window.sb.storage
          .from('shape')
          .createSignedUrls(comFoto.map(r => r.foto_path), 3600);

        if (!errUrl) {
          (urls ?? []).forEach(u => {
            if (u.signedUrl) signedUrls[u.path] = u.signedUrl;
          });
        }
      }

      renderGaleria();
      renderChart();
    }

    // ── Upload + salvar ───────────────────────────
    async function salvarRegistro() {
      const data = document.getElementById('input-data').value;
      const peso = floatOrNull(document.getElementById('input-peso').value);

      if (!data) { toast('Informe a data do registro.', 'erro'); return; }
      if (peso !== null && (peso < 20 || peso > 400)) {
        toast('Peso fora do intervalo válido (20–400 kg).', 'erro'); return;
      }

      const btn = document.getElementById('btn-salvar');
      btn.disabled = true;
      btn.textContent = 'Salvando…';

      let fotoPath = null;

      // Upload da foto se houver
      if (arquivoSelecionado) {
        const arquivo = arquivoSelecionado;
        const ext = arquivo.name.split('.').pop().toLowerCase();

        if (!['jpg','jpeg','png','webp'].includes(ext)) {
          toast('Use JPEG, PNG ou WebP.', 'erro');
          btn.disabled = false; btn.textContent = 'Salvar registro'; return;
        }
        if (arquivo.size > 10 * 1024 * 1024) {
          toast('A foto não pode ultrapassar 10 MB.', 'erro');
          btn.disabled = false; btn.textContent = 'Salvar registro'; return;
        }

        // Path: {userId}/{data}-{timestamp}.ext  — evita colisão se houver 2 fotos no mesmo dia
        const path = `${userId}/${data}-${Date.now()}.${ext}`;
        const uploadedPath = await window.uploadFile('shape', path, arquivo);

        if (!uploadedPath) {
          toast('Falha no upload da foto. Verifique a conexão.', 'erro');
          btn.disabled = false; btn.textContent = 'Salvar registro'; return;
        }
        fotoPath = uploadedPath;
      }

      // Inserir registro no banco
      const { error } = await window.sb
        .from('shape')
        .insert({
          uuid:       crypto.randomUUID(),
          user_id:    userId,
          data,
          peso:       peso ?? null,
          foto_path:  fotoPath,
          updated_at: window.now()
        });

      if (error) {
        // Reverter upload se o insert falhar
        if (fotoPath) await window.deleteFile('shape', fotoPath);
        console.error(error);
        toast('Erro ao salvar o registro.', 'erro');
        btn.disabled = false; btn.textContent = 'Salvar registro'; return;
      }

      // Limpar formulário
      document.getElementById('input-data').value = hojeISO();
      document.getElementById('input-peso').value = '';
      removerFotoPreview();

      btn.disabled = false;
      btn.textContent = 'Salvar registro';
      toast('Registro salvo!');
      await carregarShape();
    }

    // ── Excluir registro ──────────────────────────
    async function deletarRegistro(uuid, fotoPath) {
      // Soft delete no banco
      await window.softDelete('shape', uuid);

      // Deletar foto do storage se houver
      if (fotoPath) {
        await window.deleteFile('shape', fotoPath);
        delete signedUrls[fotoPath];
      }

      registros = registros.filter(r => r.uuid !== uuid);
      renderGaleria();
      renderChart();
      toast('Registro excluído.');
    }

    // ── Galeria ───────────────────────────────────
    function renderGaleria() {
      const wrap  = document.getElementById('galeria');
      const total = document.getElementById('total-registros');
      total.textContent = registros.length > 0 ? `${registros.length} registro${registros.length !== 1 ? 's' : ''}` : '';

      if (registros.length === 0) {
        wrap.innerHTML = '<p class="vazio">Nenhum registro ainda.<br>Adicione o primeiro usando o formulário acima.</p>';
        return;
      }

      wrap.innerHTML = registros.map(r => {
        const d = new Date(`${r.data}T12:00:00`);
        const dataFmt = d.toLocaleDateString('pt-BR', {
          day: 'numeric', month: 'short', year: 'numeric'
        });
        const url = r.foto_path ? (signedUrls[r.foto_path] ?? null) : null;

        return `
          <div class="shape-card">
            <div class="shape-thumb"${url ? ` style="background-image:url('${url}')"` : ''}>
              ${url ? '' : '📷'}
            </div>
            <div class="shape-info">
              <span class="shape-data">${esc(dataFmt)}</span>
              ${r.peso != null ? `<span class="shape-peso">${r.peso.toLocaleString('pt-BR')} kg</span>` : ''}
            </div>
            <button class="btn-del-shape"
              data-uuid="${esc(r.uuid)}"
              data-foto="${esc(r.foto_path ?? '')}"
              title="Excluir registro">✕</button>
          </div>`;
      }).join('');
    }

    // ── Gráfico de peso ───────────────────────────
    function renderChart() {
      const comPeso = [...registros]
        .filter(r => r.peso != null)
        .sort((a, b) => a.data.localeCompare(b.data));

      const wrapEl = document.getElementById('chart-wrap');

      if (comPeso.length === 0) {
        if (pesoChart) { pesoChart.destroy(); pesoChart = null; }
        wrapEl.innerHTML = '<p class="vazio">Adicione registros com peso<br>para ver a evolução aqui.</p>';
        return;
      }

      // Restaurar canvas se foi substituído por <p>
      if (!document.getElementById('peso-chart')) {
        wrapEl.innerHTML = '<canvas id="peso-chart"></canvas>';
      }

      const labels = comPeso.map(r => {
        const d = new Date(`${r.data}T12:00:00`);
        return d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' });
      });
      const dados = comPeso.map(r => r.peso);

      if (pesoChart) {
        pesoChart.data.labels           = labels;
        pesoChart.data.datasets[0].data = dados;
        pesoChart.update();
        return;
      }

      const ctx = document.getElementById('peso-chart').getContext('2d');
      pesoChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data: dados,
            borderColor:      '#b8f566',
            backgroundColor:  'rgba(184,245,102,.07)',
            borderWidth:      2,
            pointBackgroundColor: '#b8f566',
            pointBorderColor:     '#0d0d0d',
            pointRadius:      4,
            pointHoverRadius: 6,
            fill:    true,
            tension: .35,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: { label: ctx => `${ctx.raw} kg` },
              backgroundColor: '#1a1a1a',
              borderColor:     '#2a2a2a',
              borderWidth:     1,
              titleColor:      '#e0e0e0',
              bodyColor:       '#b8f566',
              padding:         8,
            }
          },
          scales: {
            x: {
              grid:  { color: '#1f1f1f' },
              ticks: {
                color: '#555',
                maxRotation: 45,
                font: { family: "'JetBrains Mono', monospace", size: 10 }
              }
            },
            y: {
              grid:  { color: '#1f1f1f' },
              ticks: {
                color: '#555',
                font:  { family: "'JetBrains Mono', monospace", size: 10 },
                callback: v => `${v} kg`
              }
            }
          }
        }
      });
    }

    // ── Preview de foto ───────────────────────────
    function aplicarFotoPreview(file) {
      arquivoSelecionado = file;
      const url  = URL.createObjectURL(file);
      const drop = document.getElementById('foto-drop');
      drop.style.backgroundImage = `url('${url}')`;
      drop.classList.add('tem-preview');
    }

    function removerFotoPreview() {
      arquivoSelecionado = null;
      const drop = document.getElementById('foto-drop');
      drop.style.backgroundImage = '';
      drop.classList.remove('tem-preview');
      document.getElementById('input-foto').value = '';
    }

    // ── Modal ─────────────────────────────────────
    function confirmar(msg, fn) {
      document.getElementById('confirm-msg').textContent = msg;
      confirmFn = fn;
      document.getElementById('modal-confirm').style.display = '';
    }

    function fecharModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // ── Eventos ───────────────────────────────────
    function bindEventos() {
      // Salvar registro
      document.getElementById('btn-salvar').addEventListener('click', salvarRegistro);

      // Seleção de foto via input
      document.getElementById('input-foto').addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) aplicarFotoPreview(file);
      });

      // Remover foto selecionada
      document.getElementById('btn-remover-foto').addEventListener('click', e => {
        e.stopPropagation();
        removerFotoPreview();
      });

      // Drag & drop na área de foto
      const drop = document.getElementById('foto-drop');
      drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.borderColor = 'var(--accent)'; });
      drop.addEventListener('dragleave', () => { drop.style.borderColor = ''; });
      drop.addEventListener('drop', e => {
        e.preventDefault();
        drop.style.borderColor = '';
        const file = e.dataTransfer.files[0];
        if (file) aplicarFotoPreview(file);
      });

      // Deletar registro (delegação na galeria)
      document.getElementById('galeria').addEventListener('click', e => {
        const btn = e.target.closest('.btn-del-shape');
        if (!btn) return;
        const { uuid, foto } = btn.dataset;
        confirmar(
          `Excluir este registro? ${foto ? 'A foto também será removida do storage.' : ''}`,
          () => deletarRegistro(uuid, foto || null)
        );
      });

      // Modal: fechar via data-fechar e backdrop
      document.querySelectorAll('[data-fechar]').forEach(el =>
        el.addEventListener('click', () => fecharModal(el.dataset.fechar))
      );
      document.getElementById('modal-confirm').addEventListener('click', e => {
        if (e.target === document.getElementById('modal-confirm')) fecharModal('modal-confirm');
      });

      // Modal: confirmar
      document.getElementById('btn-confirmar').addEventListener('click', async () => {
        fecharModal('modal-confirm');
        if (confirmFn) { await confirmFn(); confirmFn = null; }
      });

      // Escape fecha modal
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') fecharModal('modal-confirm');
      });
    }
  </script>

</body>
</html>
