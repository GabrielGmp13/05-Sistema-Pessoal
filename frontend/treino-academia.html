<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia — Sistema Pessoal</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* ── Views ───────────────────────────────────── */
    .view { display: none; }
    .view.ativa { display: block; }

    /* ── Page header ─────────────────────────────── */
    .page-header { margin-bottom: 1.25rem; }
    .page-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      margin: 0 0 .2rem;
      color: var(--text);
    }
    .page-header p { margin: 0; font-size: .82rem; color: #555; }

    /* ── Seleção de treino ───────────────────────── */
    .treinos-grid { display: flex; flex-direction: column; gap: .6rem; }

    .treino-opcao {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: .9rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: default;
    }

    .treino-opcao-nome {
      font-size: .95rem;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-comecar {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: .5rem 1rem;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: filter .12s;
    }
    .btn-comecar:hover { filter: brightness(1.1); }
    .btn-comecar:disabled { opacity: .5; cursor: default; filter: none; }

    /* ── Cabeçalho do treino em andamento ────────── */
    .treino-em-andamento-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1.25rem;
    }
    .treino-em-andamento-header h2 {
      flex: 1;
      margin: 0;
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-finalizar {
      background: none;
      border: 1px solid #ff6b6b;
      border-radius: 8px;
      color: #ff6b6b;
      cursor: pointer;
      padding: .45rem .9rem;
      font-size: .82rem;
      font-weight: 600;
      transition: background .12s;
      flex-shrink: 0;
    }
    .btn-finalizar:hover { background: rgba(255,107,107,.1); }

    /* ── Card de exercício ───────────────────────── */
    .ex-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: .85rem;
      overflow: hidden;
    }

    .ex-card-header {
      padding: .8rem 1rem .6rem;
      border-bottom: 1px solid var(--border);
    }

    .ex-nome {
      display: block;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }

    .ex-meta {
      display: flex;
      gap: 1rem;
      margin-top: .3rem;
      flex-wrap: wrap;
    }

    .ex-pr-hist {
      font-size: .72rem;
      color: #555;
      font-family: 'JetBrains Mono', monospace;
    }
    .ex-pr-hist.tem-pr { color: var(--accent); }

    /* ── Lista de séries registradas ─────────────── */
    .series-lista {
      padding: .4rem 1rem;
      display: flex;
      flex-direction: column;
      gap: .25rem;
      min-height: 4px;
    }

    .serie-row {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .25rem 0;
    }

    .serie-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      color: #444;
      min-width: 16px;
    }

    .serie-vals {
      flex: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: .88rem;
      color: var(--text);
    }

    .pr-badge {
      font-size: .7rem;
      background: rgba(184,245,102,.13);
      color: var(--accent);
      border: 1px solid rgba(184,245,102,.28);
      border-radius: 4px;
      padding: 1px 6px;
      white-space: nowrap;
    }

    .btn-del-serie {
      background: none;
      border: none;
      color: #3a3a3a;
      cursor: pointer;
      font-size: .75rem;
      padding: .15rem .3rem;
      border-radius: 4px;
      transition: color .12s;
    }
    .btn-del-serie:hover { color: #ff6b6b; }

    /* ── Input de nova série ─────────────────────── */
    .serie-input-area {
      display: flex;
      align-items: flex-end;
      gap: .5rem;
      padding: .6rem 1rem .85rem;
    }

    .input-field-wrap {
      flex: 1;
      min-width: 0;
    }

    .input-field-label {
      display: block;
      font-size: .68rem;
      color: #555;
      margin-bottom: .25rem;
      letter-spacing: .02em;
    }

    .input-serie {
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem;
      padding: .55rem .4rem;
    }

    .btn-add {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      width: 48px;
      height: 48px;
      font-size: 1.6rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: filter .12s;
      margin-bottom: 0;
    }
    .btn-add:hover   { filter: brightness(1.1); }
    .btn-add:disabled { opacity: .4; cursor: default; filter: none; }

    /* ── Timer de descanso (fixo na base) ────────── */
    #timer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: .7rem 1.2rem .85rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      z-index: 50;
    }

    .timer-esquerda { flex-shrink: 0; }

    .timer-label {
      font-size: .68rem;
      color: #555;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .timer-valor {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      color: var(--accent);
      line-height: 1.1;
    }

    .timer-progress-wrap {
      flex: 1;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .timer-progress {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 1s linear;
    }

    .btn-skip {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #666;
      cursor: pointer;
      padding: .35rem .7rem;
      font-size: .78rem;
      white-space: nowrap;
      flex-shrink: 0;
      transition: border-color .12s, color .12s;
    }
    .btn-skip:hover { border-color: var(--text); color: var(--text); }

    .tem-timer { padding-bottom: 5rem; }

    /* ── Vazio / loading ─────────────────────────── */
    .vazio {
      text-align: center;
      color: #444;
      font-size: .85rem;
      padding: 2rem 1rem;
      line-height: 1.7;
    }
    .vazio a { color: var(--accent); }

    #loading {
      text-align: center;
      padding: 3rem;
      color: #555;
      font-size: .9rem;
    }

    /* ── Toast ───────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(56px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .6rem 1.2rem;
      font-size: .82rem;
      color: var(--text);
      z-index: 200;
      opacity: 0;
      transition: transform .2s ease, opacity .2s ease;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.ok   { border-color: var(--accent); }
    .toast.erro { border-color: #ff6b6b; }

    /* ── Modal ───────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 340px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.1rem .75rem;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 {
      margin: 0;
      font-family: 'Syne', sans-serif;
      font-size: .92rem;
      color: var(--text);
    }
    .modal-close {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: .85rem;
      padding: .2rem .3rem;
      transition: color .15s;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 1rem 1.1rem; }
    .modal-body p { margin: 0; font-size: .88rem; color: var(--text); line-height: 1.55; }
    .modal-footer {
      display: flex;
      gap: .6rem;
      justify-content: flex-end;
      padding: .7rem 1.1rem .9rem;
    }
    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #888;
      cursor: pointer;
      padding: .4rem .8rem;
      font-size: .82rem;
      transition: border-color .12s;
    }
    .btn-ghost:hover { border-color: #555; }
    .btn-danger {
      background: none;
      border: 1px solid #ff6b6b;
      border-radius: 6px;
      color: #ff6b6b;
      cursor: pointer;
      padding: .4rem .8rem;
      font-size: .82rem;
      transition: background .12s;
    }
    .btn-danger:hover { background: rgba(255,107,107,.1); }
  </style>
</head>
<body>

  <!-- Navbar no padrão do sistema (com .nav-brand e .nav-link) -->
  <nav class="nav">

    <a class="nav-link" href="treino-plano.html">

  <main class="main-content" id="main-container">

    <div id="loading">Carregando…</div>

    <!-- View 1: Escolher divisão -->
    <div id="view-selecao" class="view">
      <div class="page-header">
        <h1>Academia</h1>
        <p>Escolha o treino de hoje</p>
      </div>
      <div id="treinos-grid" class="treinos-grid"></div>
      <p id="treinos-vazio" class="vazio" style="display:none">
        Nenhuma divisão cadastrada.<br>
        <a href="treino-plano.html">Monte seu plano de treino</a> primeiro.
      </p>
    </div>

    <!-- View 2: Treino em andamento -->
    <div id="view-treino" class="view">
      <div class="treino-em-andamento-header">
        <h2 id="titulo-treino"></h2>
        <button id="btn-finalizar" class="btn-finalizar">Finalizar</button>
      </div>
      <div id="exercicios-wrap"></div>
    </div>

  </main>

  <!-- Timer de descanso -->
  <div id="timer-bar" style="display:none">
    <div class="timer-esquerda">
      <div class="timer-label">Descanso</div>
      <div id="timer-valor" class="timer-valor">1:30</div>
    </div>
    <div class="timer-progress-wrap">
      <div id="timer-progress" class="timer-progress" style="width:100%"></div>
    </div>
    <button id="btn-skip" class="btn-skip">Pular</button>
  </div>

  <!-- Modal de confirmação -->
  <div id="modal-confirm" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3>Confirmar</h3>
        <button class="modal-close" data-fechar="modal-confirm" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body">
        <p id="confirm-msg"></p>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" data-fechar="modal-confirm">Cancelar</button>
        <button id="btn-confirmar" class="btn-danger">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    'use strict';

    // ── Constante ──────────────────────────────────
    const DESCANSO_PADRAO = 90;

    // ── Estado ─────────────────────────────────────
    let userId      = null;
    let treinos     = [];
    let exercicios  = [];
    let treinoAtivo = null;
    let sessaoId    = null;

    // { [exercicio_uuid]: [{uuid, serie_numero, carga_real, reps_real, isPr}] }
    let seriesAtual = {};

    // { [exercicio_uuid]: pesoMaxHistorico }
    let prHistorico = {};

    // Timer
    let timerInterval = null;
    let timerRestante = 0;
    let timerTotal    = DESCANSO_PADRAO;

    // Modal
    let confirmFn = null;

    // ── Bootstrap ───────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      const session = await window.authReady;
      if (!session) return;
      await inicializar(session.user.id);
    });

    async function inicializar(uid) {
      userId = uid;
      await carregarTreinos();
      document.getElementById('loading').style.display = 'none';
      mostrarView('view-selecao');
      bindEventos();
    }

    // ── Utilitários ─────────────────────────────────
    function esc(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&').replace(/</g, '<')
        .replace(/>/g, '>').replace(/"/g, '"')
        .replace(/'/g, '&#039;');
    }

    function toast(msg, tipo = 'ok') {
      document.querySelectorAll('.toast').forEach(t => t.remove());
      const el = document.createElement('div');
      el.className   = `toast ${tipo}`;
      el.textContent = msg;
      document.body.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, 3000);
    }

    function mostrarView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('ativa'));
      document.getElementById(id).classList.add('ativa');
    }

    function hojeISO() {
      return new Date().toISOString().split('T')[0];
    }

    function formatarTempo(seg) {
      const m = Math.floor(seg / 60);
      const s = seg % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function floatOrNull(val) {
      const v = parseFloat(String(val).replace(',', '.'));
      return isNaN(v) || v < 0 ? null : v;
    }

    function intOrNull(val) {
      const v = parseInt(val, 10);
      return isNaN(v) || v < 1 ? null : v;
    }

    // ── Carregar treinos ────────────────────────────
    async function carregarTreinos() {
      const { data, error } = await window.sb
        .from('treinos')
        .select('*')
        .eq('user_id', userId)
        .eq('deleted', false)
        .order('updated_at', { ascending: true });

      if (error) { console.error('[treino-academia] carregar treinos:', error.message); return; }
      treinos = data ?? [];
      renderOpcoesTreino();
    }

    function renderOpcoesTreino() {
      const grid  = document.getElementById('treinos-grid');
      const vazio = document.getElementById('treinos-vazio');
      vazio.style.display = treinos.length ? 'none' : '';

      grid.innerHTML = treinos.map(t => `
        <div class="treino-opcao">
          <span class="treino-opcao-nome">${esc(t.nome)}</span>
          <button class="btn-comecar" data-treino-id="${esc(t.uuid)}">Começar →</button>
        </div>`).join('');
    }

    // ── Iniciar treino ──────────────────────────────
    async function iniciarTreino(treinoId) {
      document.querySelectorAll('.btn-comecar').forEach(b => { b.disabled = true; });

      treinoAtivo = treinos.find(t => t.uuid === treinoId) ?? null;
      if (!treinoAtivo) { document.querySelectorAll('.btn-comecar').forEach(b => { b.disabled = false; }); return; }

      // Cria a sessão no Supabase — nomes de colunas CORRETOS
      sessaoId = crypto.randomUUID();
      const { error: errSessao } = await window.sb
        .from('sessoes_treino')
        .insert({
          uuid:       sessaoId,
          user_id:    userId,
          treino_uuid: treinoAtivo.uuid,
          data_inicio: window.now(),
          updated_at: window.now()
        });

      if (errSessao) {
        console.error('[treino-academia] criar sessão:', errSessao.message);
        document.querySelectorAll('.btn-comecar').forEach(b => { b.disabled = false; });
        return;
      }

      // Carrega exercícios da divisão — .eq('treino_uuid', ...) CORRETO
      const { data: exData, error: errEx } = await window.sb
        .from('exercicios')
        .select('*')
        .eq('treino_uuid', treinoId)
        .eq('deleted', false)
        .order('ordem', { ascending: true });

      if (errEx) {
        console.error('[treino-academia] carregar exercícios:', errEx.message);
        document.querySelectorAll('.btn-comecar').forEach(b => { b.disabled = false; });
        return;
      }

      exercicios = exData ?? [];

      if (exercicios.length === 0) {
        toast('Esta divisão não tem exercícios cadastrados.', 'erro');
        await window.softDelete('sessoes_treino', sessaoId);
        sessaoId = null;
        treinoAtivo = null;
        document.querySelectorAll('.btn-comecar').forEach(b => { b.disabled = false; });
        return;
      }

      seriesAtual = {};
      exercicios.forEach(ex => { seriesAtual[ex.uuid] = []; });
      await carregarPRHistorico();

      document.getElementById('titulo-treino').textContent = treinoAtivo.nome;
      renderWorkout();
      mostrarView('view-treino');
    }

    // ── PR histórico ────────────────────────────────
    async function carregarPRHistorico() {
      if (exercicios.length === 0) return;

      const ids = exercicios.map(e => e.uuid);
      const { data, error } = await window.sb
        .from('series_executadas')
        .select('exercicio_uuid, carga_real')
        .eq('user_id', userId)
        .eq('deleted', false)
        .in('exercicio_uuid', ids);

      if (error) { console.warn('Falha ao carregar PR histórico:', error.message); return; }

      prHistorico = {};
      (data ?? []).forEach(s => {
        if (s.carga_real == null) return;
        const atual = prHistorico[s.exercicio_uuid];
        if (atual == null || s.carga_real > atual) {
          prHistorico[s.exercicio_uuid] = s.carga_real;
        }
      });
    }

    // ── Renderizar tela de treino ───────────────────
    function renderWorkout() {
      const wrap = document.getElementById('exercicios-wrap');

      wrap.innerHTML = exercicios.map(ex => {
        const pr    = prHistorico[ex.uuid];
        const prTxt = pr != null
          ? `PR: ${pr.toLocaleString('pt-BR')} kg`
          : 'Sem registro anterior';

        return `
          <div class="ex-card" id="card-${esc(ex.uuid)}">
            <div class="ex-card-header">
              <span class="ex-nome">${esc(ex.nome)}</span>
              <div class="ex-meta">
                <span class="ex-pr-hist${pr != null ? ' tem-pr' : ''}"
                      id="pr-label-${esc(ex.uuid)}">${esc(prTxt)}</span>
              </div>
            </div>
            <div class="series-lista" id="series-${esc(ex.uuid)}"></div>
            <div class="serie-input-area">
              <div class="input-field-wrap">
                <span class="input-field-label">Peso (kg)</span>
                <input class="input-serie" id="peso-${esc(ex.uuid)}"
                  type="number" inputmode="decimal"
                  min="0" step="0.5" placeholder="0">
              </div>
              <div class="input-field-wrap">
                <span class="input-field-label">Reps</span>
                <input class="input-serie" id="reps-${esc(ex.uuid)}"
                  type="number" inputmode="numeric"
                  min="1" step="1" placeholder="0">
              </div>
              <button class="btn-add"
                data-ex-id="${esc(ex.uuid)}"
                title="Adicionar série">+</button>
            </div>
          </div>`;
      }).join('');
    }

    function renderSeriesDoExercicio(exercicioUuid) {
      const lista = document.getElementById(`series-${exercicioUuid}`);
      if (!lista) return;

      const series = seriesAtual[exercicioUuid] ?? [];
      if (series.length === 0) { lista.innerHTML = ''; return; }

      lista.innerHTML = series.map(s => `
        <div class="serie-row">
          <span class="serie-num">${s.serie_numero}</span>
          <span class="serie-vals">
            ${s.carga_real != null ? s.carga_real.toLocaleString('pt-BR') + ' kg' : '—'}
            × ${s.reps_real != null ? s.reps_real : '—'}
          </span>
          ${s.isPr ? '<span class="pr-badge">⭐ PR</span>' : ''}
          <button class="btn-del-serie"
            data-uuid="${esc(s.uuid)}"
            data-ex-id="${esc(exercicioUuid)}"
            title="Remover série">✕</button>
        </div>`).join('');
    }

    // ── Adicionar série ─────────────────────────────
    async function adicionarSerie(exercicioUuid) {
      const pesoEl = document.getElementById(`peso-${exercicioUuid}`);
      const repsEl = document.getElementById(`reps-${exercicioUuid}`);

      const carga_real = floatOrNull(pesoEl.value);
      const reps_real  = intOrNull(repsEl.value);

      if (carga_real === null) { toast('Informe um peso válido (0 ou mais).', 'erro'); pesoEl.focus(); return; }
      if (reps_real === null) { toast('Informe o número de repetições.', 'erro'); repsEl.focus(); return; }

      const btn = document.querySelector(`.btn-add[data-ex-id="${exercicioUuid}"]`);
      if (btn) btn.disabled = true;

      const series     = seriesAtual[exercicioUuid] ?? [];
      const serie_numero = series.length + 1;
      const prRef      = prHistorico[exercicioUuid];
      const isPr       = prRef != null && carga_real > prRef;
      const uuid       = crypto.randomUUID();

      // Nomes de colunas CORRETOS conforme o schema
      const { error } = await window.sb
        .from('series_executadas')
        .insert({
          uuid,
          user_id:       userId,
          sessao_uuid:   sessaoId,
          exercicio_uuid: exercicioUuid,
          serie_numero,
          carga_real,
          reps_real,
          updated_at:    window.now()
        });

      if (error) {
        console.error('[treino-academia] inserir série:', error.message);
        if (btn) btn.disabled = false;
        return;
      }

      seriesAtual[exercicioUuid] = [...series, { uuid, serie_numero, carga_real, reps_real, isPr }];

      if (isPr) {
        prHistorico[exercicioUuid] = carga_real;
        const label = document.getElementById(`pr-label-${exercicioUuid}`);
        if (label) {
          label.textContent = `PR: ${carga_real.toLocaleString('pt-BR')} kg`;
          label.classList.add('tem-pr');
        }
      }

      renderSeriesDoExercicio(exercicioUuid);

      pesoEl.value = carga_real;
      repsEl.value = '';
      repsEl.focus();

      if (btn) btn.disabled = false;
      if (isPr) toast('⭐ Personal Record!');

      iniciarTimer(DESCANSO_PADRAO);
    }

    // ── Remover série ───────────────────────────────
    async function removerSerie(uuid, exercicioUuid) {
      const { error } = await window.softDelete('series_executadas', uuid);
      if (error) { console.error('[treino-academia] remover série:', error.message); return; }

      seriesAtual[exercicioUuid] = (seriesAtual[exercicioUuid] ?? [])
        .filter(s => s.uuid !== uuid)
        .map((s, i) => ({ ...s, serie_numero: i + 1 }));

      renderSeriesDoExercicio(exercicioUuid);
    }

    // ── Timer de descanso ───────────────────────────
    function iniciarTimer(segundos) {
      pararTimer();
      timerRestante = segundos;
      timerTotal    = segundos;
      atualizarTimerUI();
      document.getElementById('timer-bar').style.display           = '';
      document.getElementById('main-container').classList.add('tem-timer');

      timerInterval = setInterval(() => {
        timerRestante = Math.max(0, timerRestante - 1);
        atualizarTimerUI();
        if (timerRestante <= 0) pararTimer();
      }, 1000);
    }

    function atualizarTimerUI() {
      document.getElementById('timer-valor').textContent = formatarTempo(timerRestante);
      const pct = timerTotal > 0 ? (timerRestante / timerTotal) * 100 : 0;
      document.getElementById('timer-progress').style.width = `${pct}%`;
    }

    function pararTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      document.getElementById('timer-bar').style.display              = 'none';
      document.getElementById('main-container').classList.remove('tem-timer');
    }

    // ── Finalizar treino ────────────────────────────
    function finalizarTreino() {
      const total = Object.values(seriesAtual).reduce((n, s) => n + s.length, 0);
      const msg = total > 0
        ? `Finalizar o treino? ${total} série${total !== 1 ? 's' : ''} salva${total !== 1 ? 's' : ''}.`
        : 'Nenhuma série registrada. Deseja mesmo encerrar?';

      confirmar(msg, async () => {
        pararTimer();
        treinoAtivo = null;
        sessaoId    = null;
        exercicios  = [];
        seriesAtual = {};
        prHistorico = {};
        document.getElementById('exercicios-wrap').innerHTML = '';
        mostrarView('view-selecao');
        toast('Treino finalizado!');
      });
    }

    // ── Modal ───────────────────────────────────────
    function confirmar(msg, fn) {
      document.getElementById('confirm-msg').textContent = msg;
      confirmFn = fn;
      document.getElementById('modal-confirm').style.display = '';
    }

    function fecharModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // ── Eventos ─────────────────────────────────────
    function bindEventos() {

      document.getElementById('treinos-grid').addEventListener('click', e => {
        const btn = e.target.closest('[data-treino-id]');
        if (btn) iniciarTreino(btn.dataset.treinoId);
      });

      document.getElementById('exercicios-wrap').addEventListener('click', e => {
        const addBtn = e.target.closest('.btn-add');
        if (addBtn) { adicionarSerie(addBtn.dataset.exId); return; }

        const delBtn = e.target.closest('.btn-del-serie');
        if (delBtn) {
          const { uuid, exId } = delBtn.dataset;
          confirmar('Remover esta série?', () => removerSerie(uuid, exId));
        }
      });

      document.getElementById('exercicios-wrap').addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const card = e.target.closest('.ex-card');
        if (!card) return;
        const exId = card.id.replace('card-', '');
        adicionarSerie(exId);
      });

      document.getElementById('btn-finalizar').addEventListener('click', finalizarTreino);

      document.getElementById('btn-skip').addEventListener('click', pararTimer);

      document.querySelectorAll('[data-fechar]').forEach(el =>
        el.addEventListener('click', () => fecharModal(el.dataset.fechar))
      );
      document.getElementById('modal-confirm').addEventListener('click', e => {
        if (e.target === document.getElementById('modal-confirm')) fecharModal('modal-confirm');
      });

      document.getElementById('btn-confirmar').addEventListener('click', async () => {
        fecharModal('modal-confirm');
        if (confirmFn) { await confirmFn(); confirmFn = null; }
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') fecharModal('modal-confirm');
      });
    }
  </script>

</body>
