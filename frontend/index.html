<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/auth.js"></script>
<script>
'use strict';

const DIAS_SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

function hojeISO() {
  return new Date().toISOString().slice(0, 10);
}

function ultimos7Dias() {
  const dias = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    dias.push(d.toISOString().slice(0, 10));
  }
  return dias;
}

function diaDaSemanaLabel(diaISO) {
  return DIAS_SEMANA[new Date(diaISO + 'T12:00:00').getDay()];
}

async function carregarDashboard(userId) {
  const hoje = hojeISO();

  // Busca dados em paralelo via Supabase
  const [treinosRes, revisoesRes, sessoesRes] = await Promise.all([
    window.sb.from('treinos').select('*').eq('user_id', userId).eq('deleted', false).order('updated_at', { ascending: false }),
    window.sb.from('revisao_espacada').select('*').eq('user_id', userId).eq('deleted', false),
    window.sb.from('sessoes_treino').select('*').eq('user_id', userId).eq('deleted', false)
  ]);

  const treinos  = treinosRes.data ?? [];
  const revisoes = revisoesRes.data ?? [];
  const sessoes  = sessoesRes.data ?? [];

  // Próximo treino
  document.getElementById('cardProximoTreino').textContent =
    treinos.length > 0 ? treinos[0].nome : '—';

  // Livros em andamento — placeholder (módulo biblioteca ainda não implementado)
  document.getElementById('cardLivros').textContent = '—';

  // Revisões pendentes hoje (inclui atrasadas)
  const pendentes = revisoes.filter(r => r.proxima_revisao <= hoje);
  document.getElementById('cardRevisoes').textContent = pendentes.length;

  // Próxima prova — placeholder
  document.getElementById('cardProximaProva').textContent = '—';

  // Atividade semanal
  const dias7 = ultimos7Dias();
  const contagem = Object.fromEntries(dias7.map(d => [d, 0]));
  sessoes.forEach(s => {
    const dia = (s.data_inicio || '').slice(0, 10);
    if (dia in contagem) contagem[dia]++;
  });

  renderizarGraficoSemanal(dias7.map(diaDaSemanaLabel), dias7.map(d => contagem[d]));
}

function renderizarGraficoSemanal(labels, valores) {
  new Chart(document.getElementById('weeklyChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Sessões de treino',
        data: valores,
        backgroundColor: '#b8f566',
        borderRadius: 4,
        maxBarThickness: 32
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          grid: { display: false },
          ticks: { color: '#888888', font: { family: 'JetBrains Mono', size: 11 } }
        },
        y: {
          beginAtZero: true,
          ticks: { stepSize: 1, color: '#888888', font: { family: 'JetBrains Mono', size: 11 } },
          grid: { color: '#2a2a2a' }
        }
      }
    }
  });
}

document.addEventListener('DOMContentLoaded', async () => {
  const session = await window.authReady;
  if (!session) return;
  await carregarDashboard(session.user.id);
});
</script>
