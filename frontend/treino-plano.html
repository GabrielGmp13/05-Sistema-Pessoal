<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano de Treino — Sistema Pessoal</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* ── Sub-nav ──────────────────────────────────────────────── */
    .sub-nav {
      display: flex;
      gap: 0.25rem;
      padding: 0.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.75rem;
      overflow-x: auto;
    }
    .sub-nav-link {
      flex: 1;
      min-width: max-content;
      text-align: center;
      padding: 0.5rem 1.1rem;
      border-radius: 5px;
      color: #777;
      text-decoration: none;
      font-size: 0.84rem;
      font-family: 'Syne', sans-serif;
      white-space: nowrap;
      transition: background 0.13s, color 0.13s;
    }
    .sub-nav-link:hover { color: var(--text); }
    .sub-nav-link.active {
      background: var(--accent);
      color: #0d0d0d;
      font-weight: 700;
    }

    /* ── Layout 2 colunas ─────────────────────────────────────── */
    .layout-2col {
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 1.5rem;
      align-items: start;
    }
    @media (max-width: 780px) {
      .layout-2col { grid-template-columns: 1fr; }
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      margin: 0;
    }

    /* ── Lista de divisões ────────────────────────────────────── */
    .treino-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 0.4rem;
      background: var(--surface);
      transition: border-color 0.13s;
      user-select: none;
    }
    .treino-item:hover { border-color: #4a4a4a; }
    .treino-item.active {
      border-color: var(--accent);
      background: rgba(184,245,102,0.055);
    }
    .treino-item-left { min-width: 0; }
    .treino-item-nome {
      font-family: 'Syne', sans-serif;
      font-size: 0.88rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .treino-item-desc {
      font-size: 0.71rem;
      color: #5a5a5a;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .treino-item-actions {
      display: flex;
      gap: 0.3rem;
      flex-shrink: 0;
      margin-left: 0.5rem;
    }

    /* ── Painel exercícios ────────────────────────────────────── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.1rem;
      min-height: 220px;
    }

    /* ── Linha de exercício ───────────────────────────────────── */
    .exercicio-row {
      display: grid;
      grid-template-columns: 26px 1fr auto;
      gap: 0.7rem;
      align-items: center;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 0.4rem;
      background: var(--bg);
    }
    .ordem-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .btn-ordem {
      background: none;
      border: 1px solid var(--border);
      color: #666;
      width: 26px;
      height: 18px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.58rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: border-color 0.1s, color 0.1s;
    }
    .btn-ordem:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-ordem:disabled { opacity: 0.2; cursor: default; }
    .exercicio-info { min-width: 0; }
    .exercicio-nome {
      font-family: 'Syne', sans-serif;
      font-size: 0.86rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .exercicio-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #5a5a5a;
      margin-top: 2px;
    }
    .exercicio-actions { display: flex; gap: 0.3rem; flex-shrink: 0; }

    /* ── Botões ícone ─────────────────────────────────────────── */
    .btn-ic {
      background: none;
      border: 1px solid var(--border);
      color: #777;
      width: 30px;
      height: 30px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: border-color 0.12s, color 0.12s;
      flex-shrink: 0;
    }
    .btn-ic:hover       { border-color: var(--accent); color: var(--accent); }
    .btn-ic.del:hover   { border-color: #cc3333; color: #cc3333; }

    /* ── Badge ────────────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.69rem;
      background: rgba(184,245,102,0.09);
      color: var(--accent);
      border: 1px solid rgba(184,245,102,0.22);
    }

    /* ── Empty state ──────────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #484848;
      font-size: 0.86rem;
      line-height: 1.7;
    }
    .empty svg { display: block; margin: 0 auto 0.75rem; }

    /* ── Modais ───────────────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.74);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
    }
    .overlay.hidden { display: none; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      width: 100%;
      max-width: 490px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      color: var(--text);
      margin: 0 0 1.2rem;
    }
    .modal-footer {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      margin-top: 1.2rem;
    }
    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 440px) { .form-row-2 { grid-template-columns: 1fr; } }
    .fg { margin-top: 0.9rem; }
    .fg:first-child { margin-top: 0; }
    .req { color: #cc3333; margin-left: 2px; }
    .opt { color: #555; font-size: 0.72rem; margin-left: 4px; }
  </style>
</head>
<body>

<!-- ── Modal: divisão ─────────────────────────────────────────────── -->
<div class="overlay hidden" id="modal-treino" onclick="if(event.target===this)fecharModalTreino()">
  <div class="modal" role="dialog" aria-labelledby="titulo-modal-treino">
    <p class="modal-title" id="titulo-modal-treino">Nova Divisão</p>
    <div class="fg">
      <label class="label">Nome<span class="req">*</span></label>
      <input type="text" class="form-control" id="treino-nome"
             placeholder="ex: Treino A — Peito + Tríceps"
             onkeydown="if(event.key==='Enter')salvarTreino()">
    </div>
    <div class="fg">
      <label class="label">Descrição<span class="opt">(opcional)</span></label>
      <textarea class="form-control" id="treino-desc" rows="2"
                placeholder="Notas rápidas sobre esta divisão"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="fecharModalTreino()">Cancelar</button>
      <button class="btn btn-primary"   onclick="salvarTreino()">Salvar</button>

  </div>
</div>

<!-- ── Modal: exercício ───────────────────────────────────────────── -->

    <p class="modal-title" id="titulo-modal-exercicio">Novo Exercício</p>
    <div class="fg">
      <label class="label">Nome<span class="req">*</span></label>
      <input type="text" class="form-control" id="ex-nome"
             placeholder="ex: Supino Reto com Barra"
             onkeydown="if(event.key==='Enter')document.getElementById('ex-series').focus()">
    </div>
    <div class="form-row-2 fg">
      <div>
        <label class="label">Séries alvo</label>
        <input type="number" class="form-control" id="ex-series"

      </div>
      <div>
        <label class="label">Reps alvo</label>
        <input type="number" class="form-control" id="ex-reps"
               min="1" max="200" placeholder="10" inputmode="numeric">
      </div>
    </div>
    <div class="form-row-2 fg">
      <div>
        <label class="label">Carga alvo (kg)</label>
        <input type="number" class="form-control" id="ex-carga"

        <label class="label">Descanso (seg)</label>
        <input type="number" class="form-control" id="ex-descanso"

</div>

<!-- ── Scripts ────────────────────────────────────────────────────── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="assets/db.js"></script>
<script src="assets/api.js"></script>
<script src="assets/sync.js"></script>
<script>
'use strict';

// ── Estado ───────────────────────────────────────────────────────────
let treinoList    = [];    // cache de treinos não-deletados
let treinoAtivo   = null;  // { uuid, nome, descricao } selecionado
let exercicioList = [];    // cache de exercícios do treinoAtivo, ordenado
let editTreinoId  = null;  // uuid em edição ou null (criação)
let editExId      = null;  // uuid em edição ou null (criação)

// ── Boot ─────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  await renderTreinos();
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    fecharModalTreino();
    fecharModalExercicio();
    fecharConfirm();
  });
});

// ── Treinos — render ─────────────────────────────────────────────────
async function renderTreinos() {
  const el   = document.getElementById('lista-treinos');
  const todos = await window.db.list('treinos');
  treinoList  = todos.filter(t => !t.deleted);

  if (treinoList.length === 0) {
    el.innerHTML = `<div class="empty">Nenhuma divisão criada.<br>Clique em "+ Nova" para começar.</div>`;
    return;
  }

  el.innerHTML = treinoList.map(t => {
    const sel = treinoAtivo && treinoAtivo.uuid === t.uuid ? 'active' : '';
    return `
      <div class="treino-item ${sel}" onclick="selecionarTreino('${t.uuid}')">
        <div class="treino-item-left">
          <div class="treino-item-nome">${esc(t.nome)}</div>
          ${t.descricao ? `<div class="treino-item-desc">${esc(t.descricao)}</div>` : ''}
        </div>
        <div class="treino-item-actions">
          <button class="btn-ic"     title="Editar"  onclick="event.stopPropagation();abrirModalTreino('${t.uuid}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-ic del" title="Excluir" onclick="event.stopPropagation();pedirExcluirTreino('${t.uuid}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14H6L5,6"/><path d="M10,11v6M14,11v6"/><path d="M9,6V4h6v2"/></svg>
          </button>
        </div>
      </div>`;
  }).join('');
}

// ── Treinos — selecionar ─────────────────────────────────────────────
async function selecionarTreino(uuid) {
  const todos = await window.db.list('treinos');
  treinoAtivo = todos.find(t => t.uuid === uuid) || null;
  await renderTreinos();
  await renderExercicios();
}

// ── Modal: treino ────────────────────────────────────────────────────
async function abrirModalTreino(uuid) {
  editTreinoId = uuid || null;

  if (uuid) {
    const t = treinoList.find(x => x.uuid === uuid);
    if (!t) return;
    document.getElementById('titulo-modal-treino').textContent = 'Editar Divisão';
    document.getElementById('treino-nome').value = t.nome;
    document.getElementById('treino-desc').value = t.descricao || '';
  } else {
    document.getElementById('titulo-modal-treino').textContent = 'Nova Divisão';
    document.getElementById('treino-nome').value = '';
    document.getElementById('treino-desc').value = '';
  }

  document.getElementById('modal-treino').classList.remove('hidden');
  setTimeout(() => document.getElementById('treino-nome').focus(), 40);
}

function fecharModalTreino() {
  document.getElementById('modal-treino').classList.add('hidden');
}

async function salvarTreino() {
  const nome = document.getElementById('treino-nome').value.trim();
  if (!nome) { document.getElementById('treino-nome').focus(); return; }

  const descricao = document.getElementById('treino-desc').value.trim();
  const now       = new Date().toISOString();

  if (editTreinoId) {
    await window.db.update('treinos', editTreinoId, { nome, descricao, updated_at: now });
    if (treinoAtivo && treinoAtivo.uuid === editTreinoId) {
      treinoAtivo.nome     = nome;
      treinoAtivo.descricao = descricao;
    }
  } else {
    await window.db.create('treinos', {
      uuid: crypto.randomUUID(), nome, descricao,
      updated_at: now, deleted: 0
    });
  }

  fecharModalTreino();
  await renderTreinos();
  if (treinoAtivo) await renderExercicios();
}

// ── Exercícios — render ──────────────────────────────────────────────
async function renderExercicios() {
  const painel = document.getElementById('painel-exercicios');
  if (!treinoAtivo) return;

  const todos    = await window.db.list('exercicios');
  exercicioList  = todos
    .filter(e => e.treino_uuid === treinoAtivo.uuid && !e.deleted)
    .sort((a, b) => (a.ordem ?? 9999) - (b.ordem ?? 9999));

  const n = exercicioList.length;

  painel.innerHTML = `
    <div class="section-header">
      <div style="display:flex;align-items:center;gap:0.5rem;min-width:0;overflow:hidden">
        <h2 class="section-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
          ${esc(treinoAtivo.nome)}
        </h2>
        <span class="badge">${n} ex.</span>
      </div>
      <button class="btn btn-primary" style="flex-shrink:0" onclick="abrirModalExercicio(null)">+ Exercício</button>
    </div>
    ${n === 0
      ? `<div class="empty" style="padding:1.5rem 0">
           Nenhum exercício. Clique em "+ Exercício".
         </div>`
      : exercicioList.map((e, i) => rowExercicio(e, i, n)).join('')
    }`;
}

function rowExercicio(e, i, total) {
  const partes = [];
  if (e.series_alvo)       partes.push(`${e.series_alvo}×${e.reps_alvo ?? '?'}`);
  if (e.carga_alvo)        partes.push(`${e.carga_alvo} kg`);
  if (e.descanso_segundos) partes.push(`${e.descanso_segundos}s desc.`);
  const meta = partes.length ? partes.join(' · ') : '— sem parâmetros';

  return `
    <div class="exercicio-row">
      <div class="ordem-col">
        <button class="btn-ordem" title="Subir"   onclick="moverEx('${e.uuid}',-1)" ${i===0       ?'disabled':''}>▲</button>
        <button class="btn-ordem" title="Descer"  onclick="moverEx('${e.uuid}', 1)" ${i===total-1 ?'disabled':''}>▼</button>
      </div>
      <div class="exercicio-info">
        <div class="exercicio-nome">${esc(e.nome)}</div>
        <div class="exercicio-meta">${meta}</div>
      </div>
      <div class="exercicio-actions">
        <button class="btn-ic"     title="Editar"  onclick="abrirModalExercicio('${e.uuid}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn-ic del" title="Excluir" onclick="pedirExcluirEx('${e.uuid}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14H6L5,6"/><path d="M10,11v6M14,11v6"/><path d="M9,6V4h6v2"/></svg>
        </button>
      </div>
    </div>`;
}

// ── Exercícios — reordenar ───────────────────────────────────────────
async function moverEx(uuid, dir) {
  const idx = exercicioList.findIndex(e => e.uuid === uuid);
  const tgt = idx + dir;
  if (tgt < 0 || tgt >= exercicioList.length) return;

  const now = new Date().toISOString();
  // Normaliza ordens se algum registro não tiver o campo definido
  const orA = exercicioList[idx].ordem ?? idx;
  const orB = exercicioList[tgt].ordem ?? tgt;

  await window.db.update('exercicios', exercicioList[idx].uuid, { ordem: orB, updated_at: now });
  await window.db.update('exercicios', exercicioList[tgt].uuid, { ordem: orA, updated_at: now });
  await renderExercicios();
}

// ── Modal: exercício ─────────────────────────────────────────────────
function abrirModalExercicio(uuid) {
  editExId = uuid || null;

  if (uuid) {
    const e = exercicioList.find(x => x.uuid === uuid);
    if (!e) return;
    document.getElementById('titulo-modal-exercicio').textContent = 'Editar Exercício';
    document.getElementById('ex-nome').value     = e.nome              || '';
    document.getElementById('ex-series').value   = e.series_alvo       ?? '';
    document.getElementById('ex-reps').value     = e.reps_alvo         ?? '';
    document.getElementById('ex-carga').value    = e.carga_alvo        ?? '';
    document.getElementById('ex-descanso').value = e.descanso_segundos ?? '';
  } else {
    document.getElementById('titulo-modal-exercicio').textContent = 'Novo Exercício';
    ['ex-nome','ex-series','ex-reps','ex-carga','ex-descanso']
      .forEach(id => { document.getElementById(id).value = ''; });
  }

  document.getElementById('modal-exercicio').classList.remove('hidden');
  setTimeout(() => document.getElementById('ex-nome').focus(), 40);
}

function fecharModalExercicio() {
  document.getElementById('modal-exercicio').classList.add('hidden');
}

async function salvarExercicio() {
  const nome = document.getElementById('ex-nome').value.trim();
  if (!nome) { document.getElementById('ex-nome').focus(); return; }

  const series_alvo       = intOrNull('ex-series');
  const reps_alvo         = intOrNull('ex-reps');
  const carga_alvo        = floatOrNull('ex-carga');
  const descanso_segundos = intOrNull('ex-descanso');
  const now               = new Date().toISOString();

  if (editExId) {
    await window.db.update('exercicios', editExId, {
      nome, series_alvo, reps_alvo, carga_alvo, descanso_segundos, updated_at: now
    });
  } else {
    const maxOrdem = exercicioList.length
      ? Math.max(...exercicioList.map(e => e.ordem ?? 0))
      : -1;
    await window.db.create('exercicios', {
      uuid: crypto.randomUUID(),
      treino_uuid: treinoAtivo.uuid,
      nome, series_alvo, reps_alvo, carga_alvo, descanso_segundos,
      ordem: maxOrdem + 1,
      updated_at: now,
      deleted: 0
    });
  }

  fecharModalExercicio();
  await renderExercicios();
}

// ── Exclusão — treino ────────────────────────────────────────────────
function pedirExcluirTreino(uuid) {
  const t = treinoList.find(x => x.uuid === uuid);
  document.getElementById('confirm-texto').textContent =
    `Excluir "${t ? t.nome : 'esta divisão'}"? Todos os exercícios vinculados também serão removidos.`;
  document.getElementById('btn-confirm-del').onclick = async () => {
    await excluirTreino(uuid);
    fecharConfirm();
  };
  document.getElementById('modal-confirm').classList.remove('hidden');
}

async function excluirTreino(uuid) {
  const now   = new Date().toISOString();
  await window.db.update('treinos', uuid, { deleted: 1, updated_at: now });

  // Cascata: soft-delete todos os exercícios desta divisão
  const todos = await window.db.list('exercicios');
  for (const e of todos.filter(x => x.treino_uuid === uuid && !x.deleted)) {
    await window.db.update('exercicios', e.uuid, { deleted: 1, updated_at: now });
  }

  if (treinoAtivo && treinoAtivo.uuid === uuid) {
    treinoAtivo = null;
    document.getElementById('painel-exercicios').innerHTML = `
      <div class="empty">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#2e2e2e" stroke-width="1.5"><path d="M6 4v16M18 4v16M6 12h12M3 6h3M18 6h3M3 18h3M18 18h3"/></svg>
        Selecione uma divisão para<br>ver e editar os exercícios.
      </div>`;
  }
  await renderTreinos();
}

// ── Exclusão — exercício ─────────────────────────────────────────────
function pedirExcluirEx(uuid) {
  const e = exercicioList.find(x => x.uuid === uuid);
  document.getElementById('confirm-texto').textContent =
    `Excluir "${e ? e.nome : 'este exercício'}"?`;
  document.getElementById('btn-confirm-del').onclick = async () => {
    await excluirEx(uuid);
    fecharConfirm();
  };
  document.getElementById('modal-confirm').classList.remove('hidden');
}

async function excluirEx(uuid) {
  await window.db.update('exercicios', uuid, {
    deleted: 1, updated_at: new Date().toISOString()
  });
  await renderExercicios();
}

function fecharConfirm() {
  document.getElementById('modal-confirm').classList.add('hidden');
}

// ── Utilitários ──────────────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function intOrNull(id) {
  const v = parseInt(document.getElementById(id).value, 10);
  return isNaN(v) ? null : v;
}

function floatOrNull(id) {
  const v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? null : v;
}
